# DESIGN EXAMPLE ONLY: integrate into existing config schema after audit.
fabric_build_cache:
  enabled: false
  mode: local_only  # local_only | shared_cache | slurm_full_build | distributed
  shared_cache:
    enabled: false
    endpoint_ref: null # identifier resolved from protected service registry, not credentials
    namespace: trusted-dev
    writes_enabled: false
    max_total_gib: 250
    tls_required: true
  local:
    capacity_gib: 20
    ram_scratch_gib: 0
    min_free_disk_percent: 20
    incremental_disabled_for_cacheable_builds: true
  execution:
    slurm_enabled: false
    allowed_clusters: []
    allowed_partitions: []
    gpu_for_cpu_builds: false
    remote_fallback: local
    max_build_slots: 2
  cleanup:
    dry_run: true
    min_idle_hours: 24
    max_evict_per_pass_gib: 10
  observability:
    enabled: true
    export_existing_metrics_pipeline: true
