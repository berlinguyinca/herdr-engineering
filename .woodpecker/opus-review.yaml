# Per-PR `Opus agent review` commit status. Copy this file unchanged into any berlinguyinca repository as
# .woodpecker/opus-review.yaml; the logic lives in `herdr-opus-review` on the review host (scripts/ci/opus-review.sh).
# Setup and fork-safety notes: docs/operations/per-pr-opus-review.md
when:
  - event: pull_request
labels:
  review-host: "true"
concurrency:
  limit: 1
  group: "opus-review"
skip_clone: true
steps:
  - name: opus-review
    image: bash
    environment:
      OPUS_REVIEW_GITHUB_TOKEN:
        from_secret: opus_review_github_token
    commands:
      - '"$HOME/.local/bin/herdr-opus-review"'
