# Woodpecker CI (ci.metabolomics.us) -- the REQUIRED `unit-gates` context (ci/woodpecker/pr/unit-gates).
#
# The unit gate is sharded into .woodpecker/unit-gates-shard-{1,2,3}.yml (see the header there). Woodpecker names a status context after
# the workflow file, so this file keeps the name branch protection and the ruleset already require, and depends_on the shards: it runs only
# after all of them succeeded. If any shard fails, Woodpecker does not start this workflow (default `runs_on: [success]`); a workflow that
# never ran is not a success, so the required context cannot go green behind a red shard. tests/test_ci_unit_shards.py pins this wiring.
#
# No `when: {path: ...}`, deliberately (issue #719): a path-filtered pipeline is never created and a context that never reports cannot be
# required. The shards decide applicability themselves and always report.
when:
  - event: manual
  - event: pull_request

depends_on:
  - unit-gates-shard-1
  - unit-gates-shard-2
  - unit-gates-shard-3

skip_clone: true

steps:
  - name: unit-gates
    image: bash
    commands:
      - 'echo "unit-gates: all 3 shards (unit-gates-shard-1..3) succeeded"'
