# Woodpecker CI (ci.metabolomics.us) -- the REQUIRED `unit-gates` context (ci/woodpecker/pr/unit-gates).
#
# The unit gate is sharded into .woodpecker/unit-gates-shard-{1,2,3}.yml (see the header there). Woodpecker names a status context after
# the workflow file, so this file keeps the name branch protection and the ruleset already require, and depends_on the shards: it runs
# after all of them finished, whatever their result (`runs_on: [success, failure]`). With the default, a red shard left this context
# `pending` forever (verified on pipeline 1906): never green, but never red either, so a PR just hung. Now the step asks the Woodpecker API
# for the three shards' states and exits non-zero unless every one is `success`, so a red shard turns this required context red.
# Fail closed: an unreachable API or a missing shard is a failure. tests/test_ci_unit_shards.py pins this wiring and runs the step.
#
# No `when: {path: ...}`, deliberately (issue #719): a path-filtered pipeline is never created and a context that never reports cannot be
# required. The shards decide applicability themselves and always report.
when:
  - event: manual
  - event: pull_request

depends_on:
  - unit-gates-shard-1
  - unit-gates-shard-2
  - unit-gates-shard-3

runs_on: [success, failure]

skip_clone: true

steps:
  - name: unit-gates
    image: bash
    commands:
      - |
        python3 - <<'PY'
        import json, os, sys, time, urllib.request
        url = "%s/api/repos/%s/pipelines/%s" % (os.environ["CI_SYSTEM_URL"].rstrip("/"), os.environ["CI_REPO_ID"], os.environ["CI_PIPELINE_NUMBER"])
        want = ["unit-gates-shard-1", "unit-gates-shard-2", "unit-gates-shard-3"]
        for attempt in range(5):
            try:
                states = {w["name"]: w["state"] for w in json.load(urllib.request.urlopen(url, timeout=20))["workflows"]}
                break
            except Exception as exc:
                print("unit-gates: cannot read %s (%s)" % (url, exc))
                time.sleep(2)
        else:
            sys.exit("unit-gates: cannot read the shard states; failing closed")
        bad = {n: states.get(n, "missing") for n in want if states.get(n) != "success"}
        if bad:
            sys.exit("unit-gates: shards not green: %s" % bad)
        print("unit-gates: all %d shards (unit-gates-shard-1..%d) succeeded" % (len(want), len(want)))
        PY
