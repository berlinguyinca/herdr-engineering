# Woodpecker CI (ci.metabolomics.us) -- the Python and client unit gates (scripts/ci/unit-gates.sh).
#
# Same conventions as ui-gates.yml: `image:` names an executable on the agent, skip_clone plus a plain git checkout with the staged
# credential, pull_request and manual only (a push to a PR branch must not build twice). The step logic lives in the script so
# `bash scripts/ci/unit-gates.sh` reproduces CI from a clean checkout. The browser (Playwright) suites stay in ui-gates.yml.
#
# Whole suites, not scoped subsets; nothing is deselected. Green on the hive exec host (Python 3.13) once the host-dependent
# tests were made host-independent. Still timing-sensitive under load: test_ci_api.py's telemetry race and a few fabric tests.
# To use the larger hive pool, add `labels: {cluster: hive}` (queues are long, 10+ minutes).
#
# No `when: {path: ...}` here, deliberately. A path-filtered pipeline is never created, so on a docs-only PR this context never
# reports - and a context that never reports cannot be a required check, which is the only reason unit-gates is optional and the
# reason a PR with a failing unit-gates has been mergeable (issue #719). The path decision moved into the applicability step, so
# the pipeline always exists and always reports a verdict; a docs-only PR pays seconds and gets a green that says why it was fast.
when:
  - event: manual
  - event: pull_request

# The whole suite starts real HTTP services and PostgreSQL clusters. Use the
# same 16-CPU/64-GiB Hive pool as ui-gates rather than 4-CPU/16-GiB overflow
# workers, where short client deadlines failed under concurrent test load.
labels:
  cluster: hive

skip_clone: true

steps:
  - name: checkout
    image: bash
    commands:
      - 'set -eu'
      - 'test -r /etc/woodpecker-git-credentials || { echo "the job staged no forge credential" >&2; exit 1; }'
      - 'git init -q -b "${CI_COMMIT_BRANCH:-main}" .'
      - 'git remote add origin "https://github.com/${CI_REPO}.git"'
      - 'git fetch --no-tags origin "$CI_COMMIT_SHA"'      # full history: tests/test_deploy_scripts.py resolves older commits
      - 'git checkout -q FETCH_HEAD'
      - 'git --no-pager log --oneline -1'

  # exit 0 = run the suite, 3 = nothing covered changed, anything else = fail the pipeline. It fails open: a guard that cannot
  # work out the diff runs the suite rather than handing back a green it did not earn.
  - name: applicability
    image: bash
    commands:
      - 'set -eu'
      - 'rm -f .ci-unit-gates-not-applicable'
      - 'rc=0; bash scripts/ci/unit-gates-applicable.sh || rc=$?'
      - 'if [ "$rc" = 3 ]; then touch .ci-unit-gates-not-applicable; elif [ "$rc" != 0 ]; then exit "$rc"; fi'

  - name: unit-gates
    image: bash
    commands:
      - 'set -eu'
      - 'if [ -f .ci-unit-gates-not-applicable ]; then echo "unit-gates: no covered path changed; nothing to run"; exit 0; fi'
      - 'bash scripts/ci/unit-gates.sh'
