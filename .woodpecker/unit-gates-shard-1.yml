# Woodpecker CI (ci.metabolomics.us) -- unit gates, SHARD 1 of 3 (scripts/ci/unit-gates.sh with HERDR_UNIT_SHARD=1/3).
#
# The suite is split by a deterministic hash of each test file's path (scripts/ci/unit-shard.py; tests/test_ci_unit_shards.py proves the
# shards partition the suite, so no test is dropped). The three shard workflows run in parallel on three hive-heavy agents and each
# does its own checkout/integrate-main/applicability. The ONE required status context, ci/woodpecker/pr/unit-gates, is the aggregate
# workflow .woodpecker/unit-gates.yml, which depends_on all three: it only runs (and goes green) when every shard succeeded, so
# branch protection is unchanged. Shard 1 also runs the client (node) tests. Copies of this file differ only in the shard number.
#
# Original description of the gate follows.
#
# Same conventions as ui-gates.yml: `image:` names an executable on the agent, skip_clone plus a plain git checkout with the staged
# credential, pull_request and manual only (a push to a PR branch must not build twice). The step logic lives in the script so
# `bash scripts/ci/unit-gates.sh` reproduces CI from a clean checkout. The browser (Playwright) suites stay in ui-gates.yml.
#
# On a pull request, the integrate-main step merges current main into the PR head before the gates run, so green means "PR + main".
# The push-to-main run of the same suite is unit-gates-main.yml.
#
# Whole suites, not scoped subsets; nothing is deselected. Green on the hive exec host (Python 3.13) once the host-dependent
# tests were made host-independent. Still timing-sensitive under load: test_ci_api.py's telemetry race and a few fabric tests.
# To use the larger hive pool, add `labels: {cluster: hive}` (queues are long, 10+ minutes).
#
# No `when: {path: ...}` here, deliberately. A path-filtered pipeline is never created, so on a docs-only PR this context never
# reports - and a context that never reports cannot be a required check, which is the only reason unit-gates is optional and the
# reason a PR with a failing unit-gates has been mergeable (issue #719). The path decision moved into the applicability step, so
# the pipeline always exists and always reports a verdict; a docs-only PR pays seconds and gets a green that says why it was fast.
when:
  - event: manual
  - event: pull_request

# One pipeline per branch at a time: the gate takes ~45 min and the agent loop lands a new commit on a PR branch every
# 30-60 min, so without this a superseded commit spent a second agent-hour in parallel with its successor, and most PR
# pipelines were killed before finishing (2026-11: 14 of 45 recent pipelines killed). The freshness step below exits a
# superseded pipeline in seconds instead of letting it run the gate.
concurrency:
  limit: 1
  group: "${CI_WORKFLOW_NAME}-${CI_COMMIT_SOURCE_BRANCH}"

# The whole suite starts real HTTP services and PostgreSQL clusters. Use the
# dedicated 16-CPU/64-GiB Hive pool. The generic hive label also matches
# 4-CPU/16-GiB overflow workers, where the full suite exhausts memory.
labels:
  cluster: hive-heavy

skip_clone: true

steps:
  - name: checkout
    image: bash
    commands:
      - 'set -eu'
      - 'test -r /etc/woodpecker-git-credentials || { echo "the job staged no forge credential" >&2; exit 1; }'
      - 'git init -q -b "${CI_COMMIT_BRANCH:-main}" .'
      - 'git remote add origin "https://github.com/${CI_REPO}.git"'
      - 'git fetch --no-tags origin "$CI_COMMIT_SHA"'      # full history: tests/test_deploy_scripts.py resolves older commits
      - 'git checkout -q FETCH_HEAD'
      - 'git --no-pager log --oneline -1'

  # A superseded commit stops here (exit 1) before any install work; rules and fail-open cases in the script.
  - name: freshness
    image: bash
    commands:
      - 'set -eu'
      - 'bash scripts/ci-pipeline-freshness.sh'

  - name: integrate-main
    image: bash
    commands:
      - 'set -eu'
      - 'bash scripts/ci/integrate-main.sh'

  # exit 0 = run the suite, 3 = nothing covered changed, anything else = fail the pipeline. It fails open: a guard that cannot
  # work out the diff runs the suite rather than handing back a green it did not earn.
  - name: applicability
    image: bash
    commands:
      - 'set -eu'
      - 'rm -f .ci-unit-gates-not-applicable'
      - 'rc=0; bash scripts/ci/unit-gates-applicable.sh || rc=$?'
      - 'if [ "$rc" = 3 ]; then touch .ci-unit-gates-not-applicable; elif [ "$rc" != 0 ]; then exit "$rc"; fi'

  - name: unit-gates
    image: bash
    environment:
      HERDR_UNIT_SHARD: "1/3"
    commands:
      - 'set -eu'
      - 'if [ -f .ci-unit-gates-not-applicable ]; then echo "unit-gates: no covered path changed; nothing to run"; exit 0; fi'
      - 'bash scripts/ci/unit-gates.sh'

  # Main takes dozens of merges a day: if it moved since integrate-main, say so (conflict = fail, covered change = warning; policy in
  # the script header). One fetch when nothing moved. Skipped, like the tests, when nothing covered changed.
  - name: main-moved-check
    image: bash
    commands:
      - 'set -eu'
      - 'if [ -f .ci-unit-gates-not-applicable ]; then echo "main-moved-check: nothing ran; nothing to re-check"; exit 0; fi'
      - 'bash scripts/ci/main-moved-check.sh'
