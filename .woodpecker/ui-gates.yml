# Woodpecker CI (ci.metabolomics.us) -- the UI gates of the collaboration page (docs/operations/ui-gates.md).
#
# Written to the conventions of the organisation's other pipelines (iw-console-aliases, fsc-chemlake-mcp), read, not run:
#
#  * `image:` names an EXECUTABLE on the agent, not a container to pull (`bash`); exec hosts are Slurm jobs, so there is no docker, no
#    apt and no sudo. The step logic lives in scripts/ci/ui-gates.sh so `bash scripts/ci/ui-gates.sh` reproduces CI from a clean
#    checkout.
#  * the clone plugin fails invisibly on this backend: skip_clone plus a plain git checkout with the credential the agent stages.
#  * pull_request and manual only, so it does not build twice for a push to a PR branch.
#
# STATUS: the first run failed the pixel compare on all 88 pages because the exec host's fontconfig rendering settings differed from
# the workstation's. The browser now runs under its own pinned fontconfig (tests/playwright/ui-gates-lib.mjs), so a host difference in
# fonts or rendering settings no longer reaches a screenshot. GitHub Actions is disabled organisation-wide and is not used.
#
# No `when: {path: ...}` here, deliberately (the same fix unit-gates got in #719). A path-filtered pipeline is never created, so on a
# PR that touches no UI path `ci/woodpecker/pr/ui-gates` never reported and, being required, parked the PR on "Expected" for ever.
# The path list moved into scripts/ci/unit-gates-applicable.sh (`ui` gate); the pipeline always exists, always reports a verdict, and
# a PR that touches no UI path pays seconds for a green that says why. A manual run always runs the gate.
when:
  - event: manual
  - event: pull_request

# Only the hive `large` pool (metabolomicsgrp/high, 16 dedicated CPUs and 64 GB per agent) runs this. The gate renders ~270 pages in
# Chromium and a shared 4-8 CPU agent host timed out under load (pipelines 113, 115, 121, 125); network/services/woodpecker-slurm
# hive.env matches `label:cluster=hive` to that pool, the same way rust.yaml does.
labels:
  cluster: hive

# One pipeline per branch at a time: the gate renders ~270 pages in ~15 min and a superseded commit would otherwise spend
# that on the large pool while its successor is still queued; the freshness step exits it in seconds (same as unit-gates).
concurrency:
  limit: 1
  group: "${CI_WORKFLOW_NAME}-${CI_COMMIT_SOURCE_BRANCH}"

skip_clone: true

steps:
  - name: checkout
    image: bash
    commands:
      - 'set -eu'
      - 'test -r /etc/woodpecker-git-credentials || { echo "the job staged no forge credential" >&2; exit 1; }'
      - 'git init -q -b "${CI_COMMIT_BRANCH:-main}" .'
      - 'git remote add origin "https://github.com/${CI_REPO}.git"'
      - 'git fetch --no-tags origin "$CI_COMMIT_SHA"   # full history: integrate-main.sh needs a merge base with main'
      - 'git checkout -q FETCH_HEAD'
      - 'git --no-pager log --oneline -1'

  - name: freshness
    image: bash
    commands:
      - 'set -eu'
      - 'bash scripts/ci-pipeline-freshness.sh'

  - name: integrate-main
    image: bash
    commands:
      - 'set -eu'
      - 'bash scripts/ci/integrate-main.sh'

  # exit 0 = run the gate, 3 = no UI path changed, anything else = fail the pipeline. Fails open (see the script).
  - name: applicability
    image: bash
    commands:
      - 'set -eu'
      - 'rm -f .ci-ui-gates-not-applicable'
      - 'rc=0; bash scripts/ci/unit-gates-applicable.sh ui || rc=$?'
      - 'if [ "$rc" = 3 ]; then touch .ci-ui-gates-not-applicable; elif [ "$rc" != 0 ]; then exit "$rc"; fi'

  - name: ui-gates
    image: bash
    commands:
      - 'set -eu'
      - 'if [ -f .ci-ui-gates-not-applicable ]; then echo "ui-gates: no UI path changed; nothing to run"; exit 0; fi'
      - 'bash scripts/ci/ui-gates.sh'
