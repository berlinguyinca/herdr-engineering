name: Measured build process lifecycle

on:
  pull_request:
    paths:
      - 'herdr_engineering/build_metrics.py'
      - 'herdr_engineering/build_coord.py'
      - 'herdr_engineering/build_registry.py'
      - 'tests/test_build*.py'
      - '.coveragerc-build-metrics'
      - '.github/workflows/build-metrics.yml'
  workflow_dispatch:

jobs:
  process-wait:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install pinned verification tools
        run: python -m pip install -e '.[dev,collab,review-gate,federation]' pytest-cov==7.0.0 coverage==7.13.1 mypy==1.18.2 types-PyYAML==6.0.12.20261103 build==1.3.0 ruff==0.14.5
      - name: Lint and type-check
        run: |
          ruff check herdr_engineering/build_metrics.py tests/test_build_metrics_wait.py
          ruff format --check tests/test_build_metrics_wait.py
          mypy --follow-imports=silent --ignore-missing-imports --check-untyped-defs herdr_engineering/build_metrics.py tests/test_build_metrics_wait.py
      - name: Real unit, integration, smoke and CLI E2E
        env:
          COVERAGE_RCFILE: .coveragerc-build-metrics
        run: |
          python -m coverage run -m pytest -q -m 'not integration' tests/test_build_metrics.py tests/test_build_metrics_wait.py tests/test_build_coord.py tests/test_build_trace.py
          python -m coverage run -m pytest -q tests/test_build_registry.py::test_recorded_build_completes_and_releases_lease tests/test_build_registry.py::test_halt_stops_heartbeat_and_cancel_signals
      - name: Linux procfs registry and contract regressions
        if: runner.os == 'Linux'
        env:
          COVERAGE_RCFILE: .coveragerc-build-metrics
        run: python -m coverage run -m pytest -q tests/test_build_registry.py tests/test_build_contract_events.py
      - name: Build distributable
        run: python -m build --wheel
      - name: Preserve actual platform coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: measured-build-coverage-${{ matrix.os }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
  coverage:
    needs: process-wait
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: measured-build-coverage-*
          path: .superpowers/metrics-data
          merge-multiple: true
      - name: Enforce combined real macOS and Linux coverage
        env:
          COVERAGE_RCFILE: .coveragerc-build-metrics
        run: |
          python -m pip install coverage==7.13.1
          python -m coverage combine .superpowers/metrics-data
          python -m coverage report --fail-under=80
          python -m coverage json -o .superpowers/metrics-coverage.json
          python scripts/ci/check-cargo-coverage.py .superpowers/metrics-coverage.json
