name: Host Cargo cache

on:
  pull_request:
  push:
    branches: [feat/host-cargo-cache, feat/managed-cargo-target-storage]

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install test tools and real compiler cache
        run: |
          python -m pip install -e '.[dev,collab,review-gate,federation]' pytest-cov==7.0.0 coverage==7.10.6 mypy==1.18.2 types-PyYAML==6.0.12.20261103 build==1.3.0
          rustup toolchain install stable --profile minimal
          SCCACHE_INSTALL_DEST="$RUNNER_TEMP/herdr-tools" bash scripts/install-sccache.sh
          echo "$RUNNER_TEMP/herdr-tools" >> "$GITHUB_PATH"
      - name: Create a real disposable APFS volume
        run: |
          hdiutil create -quiet -size 1g -fs APFS -type SPARSE -volname HerdrCacheTest "$RUNNER_TEMP/herdr-cache-test.sparseimage"
          mkdir -p "$RUNNER_TEMP/herdr-cache-volume"
          hdiutil attach -quiet -nobrowse -mountpoint "$RUNNER_TEMP/herdr-cache-volume" "$RUNNER_TEMP/herdr-cache-test.sparseimage"
          echo "HERDR_CACHE_TEST_VOLUME=$RUNNER_TEMP/herdr-cache-volume" >> "$GITHUB_ENV"
      - name: Lint and type-check
        run: |
          ruff check herdr_engineering/cargo_host.py herdr_engineering/build_cache_location.py herdr_engineering/cargo_target_storage.py herdr_engineering/cargo_target_migration.py herdr_engineering/build_cache_config.py herdr_engineering/build_cache_env.py herdr_engineering/build_coord.py herdr_engineering/build_cache_inventory.py herdr_engineering/build_metrics.py tests/test_cargo_host.py tests/test_cargo_host_real.py tests/test_cargo_host_limits.py tests/test_build_cache_inventory.py tests/test_cargo_target_storage.py tests/test_cargo_managed_targets_real.py
          mypy --follow-imports=silent --ignore-missing-imports --check-untyped-defs herdr_engineering/cargo_host.py herdr_engineering/build_cache_location.py herdr_engineering/cargo_target_storage.py herdr_engineering/cargo_target_migration.py
      - name: Unit and integration regressions
        run: python -m pytest -q tests/test_build_cache_config.py tests/test_build_cache_env.py tests/test_build_cache_inventory.py tests/test_build_coord.py tests/test_build_metrics.py tests/test_cargo_host_limits.py
      - name: Real Cargo and volume tests with coverage
        run: |
          python -m pytest -m 'not e2e' -q tests/test_cargo_host.py tests/test_cargo_host_real.py tests/test_cargo_target_storage.py tests/test_cargo_managed_targets_real.py --cov=herdr_engineering.cargo_host --cov=herdr_engineering.build_cache_location --cov=herdr_engineering.cargo_target_storage --cov=herdr_engineering.cargo_target_migration --cov-config=.coveragerc-cargo-host --cov-report=term-missing --cov-report=json:/tmp/cargo-host-coverage.json --cov-fail-under=80
          python scripts/ci/check-cargo-coverage.py /tmp/cargo-host-coverage.json
      - name: Build distributable
        run: python -m build --wheel
      - name: Detach disposable volume
        if: always()
        run: hdiutil detach -quiet "$RUNNER_TEMP/herdr-cache-volume" || true
