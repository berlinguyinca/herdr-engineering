[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-engineering"
version = "0.1.0"
description = "Super HerdR / HerdR Engineering — thin curated integration layer over Herdr"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "asyncpg>=0.29", "boto3>=1.34", "psycopg2-binary>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
collab = ["PyJWT[crypto]>=2.8"]
review-gate = ["PyJWT[crypto]>=2.8"]
federation = ["cryptography>=42"]   # Ed25519 request/export signing (ADR-0008 P2); imported lazily

[project.scripts]
herdr-eng = "herdr_engineering.cli:main"
herdr-plannotator = "herdr_engineering.plannotator:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# E501 (line length) is intentionally relaxed: web.py embeds HTML and cli.py
# contains long URLs. E702 (semicolon chaining) is used deliberately in the
# argparse builder for compact set_defaults wiring.
extend-ignore = ["E501", "E702"]

[tool.setuptools.packages.find]
include = ["herdr_engineering*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import test modules by file path (not basename) so nested packages like
# tests/control_plane/ can share a basename with top-level tests (e.g.
# test_artifacts.py) without an ``import file mismatch`` collection error.
#
# The T16 end-to-end acceptance suite (tests/e2e, marker ``e2e``) spawns real servers and needs sibling checkouts, so a
# plain ``pytest`` / scripts/validate.sh deselects it. Opt in with ``-m e2e`` (scripts/run_acceptance.py does).
addopts = "--import-mode=importlib -m 'not e2e and not integration'"

[tool.pytest.ini_options.markers]
integration = "requires a live Postgres (PA_PG_DSN); skipped by default"

[tool.setuptools.package-data]
herdr_engineering = ["*.mjs"]
