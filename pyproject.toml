[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-engineering"
version = "0.1.0"
description = "Super HerdR / HerdR Engineering — thin curated integration layer over Herdr"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "asyncpg>=0.29", "boto3>=1.34", "psycopg2-binary>=2.9", "nh3==0.3.7", "slack_sdk==3.45.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "pytest-xdist==3.8.0", "ruff>=0.5", "jsonschema>=4.10", "cryptography>=42"]
collab = ["PyJWT[crypto]>=2.8", "cryptography>=42"]
review-gate = ["PyJWT[crypto]>=2.8", "cryptography>=42"]
acme = ["certbot>=3", "certbot-dns-route53>=3", "boto3>=1.34"]   # publicly trusted fabric certificates (devfabric cert/dns)
share = ["cryptography>=42"]   # lab-share session AEAD (share_session.py)
federation = ["cryptography>=42"]   # Ed25519 request/export signing (ADR-0008 P2); imported lazily

[project.scripts]
herdr-eng = "herdr_engineering.cli:main"
herdr-plannotator = "herdr_engineering.plannotator:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# E501 (line length) is intentionally relaxed: web.py embeds HTML and cli.py
# contains long URLs. E702 (semicolon chaining) is used deliberately in the
# argparse builder for compact set_defaults wiring.
extend-ignore = ["E501", "E702"]

[tool.setuptools.packages.find]
include = ["herdr_engineering*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import test modules by file path (not basename) so nested packages like
# tests/control_plane/ can share a basename with top-level tests (e.g.
# test_artifacts.py) without an ``import file mismatch`` collection error.
#
# The T16 end-to-end acceptance suite (tests/e2e, marker ``e2e``) spawns real servers and needs sibling checkouts, so a
# plain ``pytest`` / scripts/validate.sh deselects it. Opt in with ``-m e2e`` (scripts/run_acceptance.py does).
addopts = "--import-mode=importlib -m 'not e2e and not integration'"
markers = [
    "e2e: real command-line end-to-end workflows; opt in explicitly",
    "integration: needs an external dependency (a live Postgres via PA_PG_DSN, or a real CLI such as claude); deselected by default, opt in with -m integration",
]
#
# A per-test ceiling, so a stall names itself instead of eating the pipeline. The suite has been observed to stall for 6-12
# minutes on a loaded host and, before the file-descriptor floor in scripts/ci/ensure-fd-limit.sh, to die outright at ~38% with no
# summary (issue #651). Both failure modes end a run with no verdict, which is what makes them expensive: a 79-minute kill that
# names nothing costs more than a failure that names a test. 900s is deliberately far above any test that has ever passed here -
# it is a hang detector, not a performance budget - and `signal` (the POSIX default) is set explicitly so one hung test reports
# and the run continues to a summary rather than the process being killed. Override per run with --timeout=<seconds>.
timeout = 900
timeout_method = "signal"


[tool.setuptools.package-data]
herdr_engineering = ["control_plane/rakazo_defaults.json", "*.mjs", "skill_data/summary/*.md", "skill_data/summary/adapters/*.md",
                     "skill_data/handoff/*.md", "skill_data/handoff/adapters/*.md",
                     "skill_data/herdr-join/*.md", "skill_data/herdr-join/adapters/*.md",
                     "control_plane/share_static/*.html", "control_plane/share_static/*.js",
                     "control_plane/share_static/*.css", "control_plane/share_static/fonts/*.woff2",
                     "control_plane/share_static/fonts/OFL.txt", "control_plane/share_static/vendor/pdfjs/*",
                     "control_plane/projection_compatibility.json"]
