# T16 UI gates: every threshold the gates enforce. YAML only; no environment variables configure these.
# Measured on: AMD Ryzen Threadripper PRO 3945WX (24 threads), 503 GB RAM, Linux 6.8, headless Chromium 1243 (chrome-linux64).
# Budgets are deliberately loose multiples of the measured values (see docs/operations/ui-gates.md) so a loaded CI box does not flake,
# yet an order-of-magnitude regression (an O(n^2) layout, a main-thread stall) still fails.
viewports:
  desktop:
    width: 1280
    height: 800
  tablet:
    width: 768
    height: 1024
  mobile:
    width: 375
    height: 667
  reflow:
    width: 320
    height: 568
screenshots:
  # autospec ux-ui-workstream gate: visual diff above 0.1% fails.
  max_diff_pct: 0.1
  # per-channel difference (0-255) below which a pixel counts as identical (anti-aliasing noise)
  channel_tolerance: 6
  fixed_clock: "2026-10-23T10:00:00Z"
perf:
  # lineage tab: click to first rendered graph (ms)
  render_ms: 6000
  # keypress on a focused node to the inspector showing (ms)
  interaction_ms: 500
  # long tasks (>50 ms) tolerated while the graph is rendered and one interaction is made
  max_long_tasks: 25
  # one long task may not exceed this (ms)
  max_long_task_ms: 1500
tokens:
  # ratchets (the count may fall, never rise); measured on this branch, see docs/operations/ui-gates.md
  max_raw_hex: 5
  max_off_grid_spacing: 72
