version: 1
# Classified + pinned upstreams (phase 0020). Decisions:
#   ADOPT / ADAPT / OPTIONAL / REJECT / SUPERSEDED_BY_NATIVE_HERDR
# Revisions are immutable where the upstream publishes them; otherwise a
# documented stable tag is pinned. Audit notes record license/maintenance.
dependencies:
  herdr-artifacts:
    source: "berlinguyinca/herdr-artifacts"
    revision: "c6156ea"
    decision: ADOPT
    license: "MIT"
    maintenance: "active; standalone artifact skill"
    note: "Required cross-harness artifact skill, installed into the same four harnesses as herdr-handoff."
  herdr-memory:
    source: "berlinguyinca/herdr-memory"
    revision: "eb1338a4067d4e17910a9f651fc7c08551f5b8a9"
    decision: ADOPT
    license: "private"
    maintenance: "active; private Hindsight-backed memory client (contract v1, client 0.1.10)"
    note: "Optional managed harness config via herdr-eng memory install; also the canonical dashboard CLI when authorized viewers are configured. Pin must match herdr_engineering.memory_install.PINNED_REVISION and PINNED_CLIENT_VERSION (0.1.10). Offline validate-config checks schema/URL without credentials, network or cache state (herdr-memory#15); 0.1.8 names the row that stops an outbox from draining (herdr-memory#16); 0.1.9 adds the repo's first CI and a version-parity test guarding the two-builds-one-version-string incident (herdr-memory#19); 0.1.10 gives every queued operation a terminal attempt record and surfaces vanished rows as `status.lost` / doctor `lost` (herdr-memory#20, closes #4), and 0.1.9's line also makes recall/documents degrade to empty on a never-written bank and adds `provision` plus per-bank `bank:<id>` doctor checks (herdr-memory#18, closes #17)."
  herdr-memory-deploy:
    source: "berlinguyinca/herdr-memory"
    revision: "c4e0c64"
    checkout: "~/.local/share/herdr-engineering/herdr-memory"
    decision: OPTIONAL
    license: "private"
    maintenance: "active; private Hindsight deployment candidate (deploy/{compose.yaml,Dockerfile,build.sh})"
    note: "Build pin for `deploy/control-plane/deploy.sh --with-memory` (amd64 only): deploy.sh exports exactly this revision from the clone at `checkout` (override: --memory-checkout / HERDR_MEMORY_CHECKOUT) and runs its deploy/build.sh. Distinct from the client pin of `herdr-memory` (herdr_engineering.memory_install.PINNED_REVISION); bump both deliberately."
  herdr-handoff:
    source: "berlinguyinca/herdr-handoff"
    revision: "c16c2dfdd86d6c0f22d8523f894718420e23d3a1"
    decision: ADOPT
    license: "MIT"
    maintenance: "active; standalone cross-harness handoff contract"
    note: "Required operational dependency. Includes memory-context handoffs and the engineering-memory namespace routes (herdr-handoff#1, #3), and the v2 handoff envelope with pane-less launch fallback (herdr-handoff#4, v0.2.0), and same-tab takeover whose close of the replaced pane is gated on herdr observing the successor live plus `herdr-handoff confirm` for that successor (herdr-handoff#6, v0.3.0), and `/herdr::to*` handing over by default on that same proof - `--keep-source` keeps the old pane, and `source_dirty` refuses the close while it still holds uncommitted or unpushed work (herdr-handoff#7, v0.4.0), and `takeover` refusing with `subagents_running` while the source pane still has running Claude subagents recorded by `herdr-eng handoff subagent-hook` (herdr-handoff#11), and a shared handoff store (`HERDR_HANDOFF_STORE`, `store import-legacy`), one takeover per handoff id (`takeover_in_progress`, `launch_state_unknown`), `takeover --direction {down,right}` (default down) with `--source-exit-text/-key/-timeout` and `--relaunch` (`source_exit_failed`), and `create --predecessor-id/--source-pane/--source-session/--fallback`; `herdr_engineering.handoff_dependency` requires `takeover --direction` (herdr-handoff#12, v0.5.0), and `confirm` closing the source pane when `takeover` gave up waiting (`--confirm-timeout`) and the successor confirms afterwards, through the same close gate (unpushed commits, dirty worktree or another tab refuse; never after `--keep-source`, for a 0.5.0-written record, with no source pane recorded, or while a takeover holds the lock), with `close`, `source_closed`, `reason` and `source_closed_at` in its JSON (herdr-handoff#13, v0.5.1; no new CLI flag, so the capability gate is unchanged), and `herdr-handoff reap [--apply] [--include-unrecorded]` (dry run by default) closing panes that confirmed handoffs replaced, live pane checks on confirm and reap (`source_is_caller`, `successor_gone`, `source_pane_reused`, `source_working`), `close_options.source_terminal_id` recorded by takeover, and successor panes named `<project>: <goal summary>` (herdr-handoff#14, herdr-handoff#16, v0.6.0; `herdr_engineering.handoff_dependency` now also requires `reap`). Install the pinned CLI and all four harness skills before strict validation; scripts/install-handoff.sh is the only place the pin is resolved (HERDR_HANDOFF_REF overrides for a controlled rollout)."
  screenwright:
    source: "berlinguyinca/screenwright"
    revision: "tracking origin/main"
    checkout: "~/.local/share/herdr-engineering/screenwright"
    decision: ADOPT
    license: "private (package.json private: true, no LICENSE file)"
    maintenance: "active; owner's own UI before/after review tool (screenwright-review skill + sw CLI)"
    note: "The one deliberately TRACKED upstream: scripts/install-screenwright.sh fast-forwards to origin/main on every install/update run (a dirty or non-main checkout is skipped) and prints the resolved sha as `screenwright=<sha>` at install time; nothing here records it. To pin instead, set HERDR_SCREENWRIGHT_REF to a tag or sha. Opt out with --no-screenwright or HERDR_INSTALL_SCREENWRIGHT=0."
  herdr:
    source: "official (local binary)"
    revision: "0.9.1"
    decision: ADOPT
    license: "proprietary/internal"
    maintenance: "active; local binary at ~/.local/bin/herdr"
    note: "Native base primitive: saved machines, --machine forwarding, workspaces, worktrees, socket/plugin API. We build on top, never fork."
  herdr-browser:
    source: "StructuPath/herdr-browser"
    revision: null
    decision: ADAPT
    license: "check upstream"
    maintenance: "community"
    note: "Browser preview adapter used when Playwright available; our browser.py falls back safely."
  herdr-web:
    source: "eyalev/herdr-web"
    revision: null
    decision: ADAPT
    license: "check upstream"
    maintenance: "community"
    note: "Preferred web surface when compatible; our web.py provides a private stdlib fallback (spec 0060)."
  herdr-plannotator:
    source: "plannotator/herdr-plannotator"
    revision: null
    decision: ADOPT
    license: "check upstream"
    maintenance: "active"
    note: "Review authority; our PlannotatorAdapter preserves review identity/comments/decision/evidence."
  herdr-swarm:
    source: "upstream herdr-swarm"
    revision: null
    decision: OPTIONAL
    license: "check upstream"
    maintenance: "community"
    note: "Optional multi-agent helpers; not required for core integration."
  custom-remote-machine-aggregator:
    source: "concept"
    revision: null
    decision: SUPERSEDED_BY_NATIVE_HERDR
    license: "n/a"
    maintenance: "n/a"
    note: "Do NOT build a second remote-machine orchestrator; native saved machines + --machine forwarding suffice."
  custom-worktree-engine:
    source: "concept"
    revision: null
    decision: SUPERSEDED_BY_NATIVE_HERDR
    license: "n/a"
    maintenance: "n/a"
    note: "Do NOT build a generic worktree engine; Herdr owns worktrees."
  custom-ci-scheduler:
    source: "concept"
    revision: null
    decision: SUPERSEDED_BY_NATIVE_HERDR
    license: "n/a"
    maintenance: "n/a"
    note: "Woodpecker/Pileated own CI execution; our ci.py is a provider-neutral view only."
