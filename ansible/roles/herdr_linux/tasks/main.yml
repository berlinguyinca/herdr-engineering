---
# Linux fleet role (spec 0040). Exposes the same resulting capabilities as the
# macOS role. Existing packages/config are preserved; installs are idempotent.

- name: "Update package cache"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: "Install baseline CLI tools (vim, mc, btop)"
  ansible.builtin.package:
    name:
      - vim
      - mc
      - btop
    state: present

- name: "Install Python prerequisites for HerdR Engineering"
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-venv
      - git
      - curl
    state: present

- name: "Verify Herdr (pinned compatible version) is present"
  ansible.builtin.shell: |
    set -e
    if ! command -v herdr >/dev/null 2>&1 || ! herdr --version 2>/dev/null | grep -q "{{ herdr_pinned_version }}"; then
      echo "herdr install required: {{ herdr_pinned_version }}" >&2
      exit 1   # nothing here installs it (staging does): a missing or mismatched runtime must fail the host, not report changed
    fi
  changed_when: false

- name: "Verify Pi is present"
  ansible.builtin.shell: |
    set -e
    if ! command -v pi >/dev/null 2>&1; then
      echo "pi install required" >&2
      exit 1   # nothing here installs it (staging does): a missing runtime must fail the host, not report changed
    fi
  changed_when: false

- name: "Clone berlinguyinca/pi-engineering"
  ansible.builtin.git:
    repo: "https://github.com/berlinguyinca/pi-engineering.git"
    dest: "{{ ansible_facts['env']['HOME'] }}/pi-engineering"
    version: main
  ignore_errors: true

- name: "Clone berlinguyinca/autospec"
  ansible.builtin.git:
    repo: "https://github.com/berlinguyinca/autospec.git"
    dest: "{{ ansible_facts['env']['HOME'] }}/autospec"
    version: main
  ignore_errors: true
