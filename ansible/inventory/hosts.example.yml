all:
  children:
    herdr_fleet:
      children:
        linux:
          hosts:
            fry: {}
            beast:
              ai_sync_publisher: true   # the one host that runs `ai-sync push`; enforcement never runs here
            # A host under maintenance is exempt from stale alarms; the fleet
            # update sends this flag (default false) on every run:
            # beast:
            #   maintenance: true
            bender: {}
            # Opt a host into forced ai-sync convergence (publisher excluded), in its host_vars:
            #   ai_sync_enforce: true
        macos:
          hosts:
            mac: {}
# Connection addresses/users belong in private inventory/group_vars, not this repository example.
# e.g. ansible/inventory/host_vars/mac.yml:
#   ansible_host: mac.<tailnet>.ts.net
#   ansible_user: <fleet-user>
#   ansible_python_interpreter: /usr/bin/python3
