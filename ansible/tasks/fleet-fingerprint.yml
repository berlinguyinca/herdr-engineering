---
# Gather a version/registration fingerprint for the current host (no changes).
# Requires fleet_home / fleet_user to be set (see playbook preamble).
# Registers:
#   fp_herdr_version, fp_herdr_path, fp_buildgate_md5, fp_agent, fp_revision, fp_cleanup
- name: "Capture herdr-eng version fingerprint"
  # become: false — must read the FLEET user's venv/services, not root's.
  become: false
  ansible.builtin.command: "{{ fleet_home }}/.venvs/herdr-engineering/bin/herdr-eng --version"
  register: fp_herdr_version
  changed_when: false
  ignore_errors: true

- name: "Capture resolved herdr-eng binary path"
  become: false
  ansible.builtin.shell: "readlink -f {{ fleet_home }}/.venvs/herdr-engineering/bin/herdr-eng 2>/dev/null || realpath {{ fleet_home }}/.venvs/herdr-engineering/bin/herdr-eng 2>/dev/null || echo MISSING"
  args:
    executable: /bin/bash
  register: fp_herdr_path
  changed_when: false
  failed_when: false

- name: "Capture build-gate extension checksum"
  become: false
  ansible.builtin.command: >-
    python3 -c "import hashlib,os;
    p=os.path.expanduser('{{ fleet_home }}/.pi/agent/extensions/build-gate.ts');
    print(hashlib.md5(open(p,'rb').read()).hexdigest() if os.path.exists(p) else 'MISSING')"
  register: fp_buildgate_md5
  changed_when: false
  ignore_errors: true

- name: "Capture fabric-agent service state"
  # become: false — checks the FLEET user's systemd --user unit, not root's.
  # Linux -> systemd --user; macOS -> launchctl. XDG_RUNTIME_DIR is set so
  # `systemctl --user` reaches the user instance even from a non-login shell.
  become: false
  ansible.builtin.shell: |
    if command -v systemctl >/dev/null 2>&1; then
      XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user is-active \
        herdr-eng-fabric-agent.service 2>/dev/null && echo active || echo inactive
    else
      launchctl print gui/$(id -u)/herdr-eng-fabric-agent 2>/dev/null | \
        grep -q 'state = running' && echo active || echo inactive
    fi
  args:
    executable: /bin/bash
  register: fp_agent
  changed_when: false
  ignore_errors: true

- name: "Capture verified installed HerdR release"
  become: false
  ansible.builtin.command:
    argv:
      - python3
      - "{{ fleet_home }}/.local/share/herdr-engineering/stage-release.py"
      - --kind
      - herdr
      - --home
      - "{{ fleet_home }}"
      - --describe
  register: fp_release
  changed_when: false
  failed_when: false

- name: "Capture verified installed Pi release (separate from loaded sessions)"
  become: false
  ansible.builtin.command:
    argv:
      - python3
      - "{{ fleet_home }}/.local/share/herdr-engineering/stage-release.py"
      - --kind
      - pi
      - --home
      - "{{ fleet_home }}"
      - --describe
  register: fp_pi_release
  changed_when: false
  failed_when: false

- name: "Decode valid installed release attestations"
  ansible.builtin.set_fact:
    fp_revision: "{{ (fp_release.stdout | from_json).get('revision', 'MISSING') if fp_release.rc == 0 else 'MISSING' }}"
    fp_herdr_release_path: "{{ (fp_release.stdout | from_json).get('sourceRoot', 'MISSING') if fp_release.rc == 0 else 'MISSING' }}"
    fp_pi_revision: "{{ (fp_pi_release.stdout | from_json).get('revision', 'MISSING') if fp_pi_release.rc == 0 else 'MISSING' }}"
    fp_pi_path: "{{ (fp_pi_release.stdout | from_json).get('sourceRoot', '') if fp_pi_release.rc == 0 else '' }}"

- name: "Capture cleanup companion state"
  become: false
  ansible.builtin.shell: |
    if [ "{{ ansible_facts['system'] }}" = Linux ]; then
      XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user is-active --quiet \
        herdr-eng-build-cleanup.service 2>/dev/null && echo active || echo inactive
    else
      echo unsupported
    fi
  args:
    executable: /bin/bash
  register: fp_cleanup
  changed_when: false
