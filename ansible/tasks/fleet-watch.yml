---
# Package provisioning and the fabric agent precede this include. The merge-triggered rollout watcher polls GitHub and, only
# when told to, applies rollouts over ssh, so it is OFF unless the inventory sets `fleet_watch_enabled: true` for beast (the one
# controller, spec D11). Even then it only plans; rolling out needs a second opt-in, `fleet_watch_apply: true`, which adds a
# drop-in that appends --enable-rollouts. The unit file is always installed (stopped and disabled when not wanted), like the
# ai-sync enforcement unit.
- name: "Deploy the fleet rollout watcher unit"
  become: false
  when: ansible_facts['system'] == 'Linux'
  environment:
    HOME: "{{ fleet_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
  vars:
    watch_wanted: "{{ (fleet_watch_enabled | default(false) | bool) and inventory_hostname == 'beast' }}"
    watch_apply: "{{ watch_wanted and (fleet_watch_apply | default(false) | bool) }}"
  block:
    - name: "Create the user unit directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ fleet_home }}/.config/systemd/user"
        - "{{ fleet_home }}/.config/systemd/user/herdr-eng-fleet-watch.service.d"

    - name: "Install the fleet watcher service"
      ansible.builtin.copy:
        content: "{{ lookup('file', herdr_engineering_repo_root ~ '/scripts/herdr-eng-fleet-watch.service') }}"
        dest: "{{ fleet_home }}/.config/systemd/user/herdr-eng-fleet-watch.service"
        mode: "0644"

    - name: "Opt the watcher into applying rollouts (drop-in appends --enable-rollouts), only when asked"
      ansible.builtin.copy:
        content: |
          [Service]
          ExecStart=
          ExecStart=%h/.local/bin/herdr-eng fleet-watch loop --enable-rollouts
        dest: "{{ fleet_home }}/.config/systemd/user/herdr-eng-fleet-watch.service.d/apply.conf"
        mode: "0644"
      when: watch_apply | bool

    - name: "Remove the apply drop-in when rollouts are not wanted"
      ansible.builtin.file:
        path: "{{ fleet_home }}/.config/systemd/user/herdr-eng-fleet-watch.service.d/apply.conf"
        state: absent
      when: not (watch_apply | bool)

    - name: "Enable the watcher only where it is wanted"
      ansible.builtin.systemd_service:
        name: herdr-eng-fleet-watch.service
        scope: user
        daemon_reload: true
        enabled: "{{ watch_wanted | bool }}"
        state: "{{ 'restarted' if (watch_wanted | bool) else 'stopped' }}"
