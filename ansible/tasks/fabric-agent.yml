# Deploy the dev-fabric auto-registration agent on EVERY fleet host
# (spec 0110): the agent detects web services that start on the host and
# auto-registers them with the fabric gateway, so they appear at a stable
# dev:<port> URL fleet-wide (and in the gateway host's web UI) with zero
# manual steps. Loopback-only services get a tailnet-bound forwarder in
# front of them; leases are closed when a service disappears. No public
# listeners.
#
# Runs as the fleet (connection) user (become: false). herdr-eng is
# provisioned in managed immutable release directories plus a user venv.
# The gateway control URL is written to the machine-local
# ~/.config/herdr-engineering/fabric.env (a tailnet URL, not a secret).
- name: "Deploy dev-fabric auto-registration agent"
  become: false
  block:
    - name: "Create the machine-local configuration directory"
      ansible.builtin.file:
        path: "{{ fleet_home }}/.config/herdr-engineering"
        state: directory
        mode: "0700"

    - name: "Write the fabric gateway control URL for this host"
      ansible.builtin.copy:
        dest: "{{ fleet_home }}/.config/herdr-engineering/fabric.env"
        owner: "{{ fleet_user }}"
        mode: "0600"
        content: "HERDR_ENGINEERING_FABRIC_URL={{ fabric_agent_gateway_url }}\n"

    - name: "Select the controller release once for direct playbook invocations"
      ansible.builtin.set_fact:
        herdr_engineering_revision: "{{ lookup('pipe', 'git -C ' ~ (herdr_engineering_repo_root | quote) ~ ' rev-parse HEAD') }}"
      run_once: true
      when: herdr_engineering_revision is not defined

    - name: "Require an immutable HerdR release"
      ansible.builtin.assert:
        that:
          - herdr_engineering_revision is match('^(?:[0-9a-f]{40}|[0-9a-f]{64})$')

    - name: "Prepare managed deployment helper"
      ansible.builtin.include_tasks: stage-helper.yml

    - name: "Install the selected HerdR release without touching developer checkouts"
      ansible.builtin.command:
        argv:
          - python3
          - "{{ fleet_home }}/.local/share/herdr-engineering/stage-release.py"
          - --kind
          - herdr
          - --home
          - "{{ fleet_home }}"
          - --revision
          - "{{ herdr_engineering_revision }}"
      register: fabric_agent_provision
      changed_when: true
      when: not ansible_check_mode

    - name: "Use the immutable checkout for companion installation"
      ansible.builtin.set_fact:
        herdr_engineering_checkout: "{{ fleet_home }}/.local/share/herdr-engineering/herdr/releases/{{ herdr_engineering_revision }}"

    - name: "Install/enable the agent service from the refreshed checkout"
      ansible.builtin.command:
        argv: >-
          {{ ['/bin/bash', herdr_engineering_checkout ~ '/scripts/' ~
               ('fabric-agent-macos.sh' if ansible_facts['system'] == 'Darwin' else 'fabric-agent.sh')]
             + (['--repo', herdr_engineering_checkout] if ansible_facts['system'] == 'Darwin' else []) }}
      environment:
        HERDR_ENGINEERING_CHECKOUT: "{{ herdr_engineering_checkout | default(fleet_home ~ '/herdr-engineering-repo') }}"
        HOME: "{{ fleet_home }}"
        USER: "{{ fleet_user }}"
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
        PATH: "{{ fleet_home }}/.venvs/herdr-engineering/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:{{ fleet_home }}/.local/bin"
      register: fabric_agent_result
      changed_when: false
      when: not ansible_check_mode
