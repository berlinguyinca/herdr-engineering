---
# HerdR Engineering fleet bootstrap (spec 0040).
#
# Converges a supported host to the HerdR Engineering baseline:
#   - Herdr (pinned compatible version)
#   - Pi + provider config pointing all LLM traffic at https://llm.metabolomics.us
#   - berlinguyinca/pi-engineering, berlinguyinca/autospec
#   - Tailscale connectivity checks (no reusable auth keys in Git)
#   - vim, mc, btop
#   - prerequisites for adopted Powerpack components
#   - HerdR Engineering state/artifact directories
#
# Existing user config is merged/backed up, never overwritten wholesale.
# No secrets live in this inventory or any committed file. The playbook is
# idempotent: a second run produces no unexpected changes.
#
# Run:
#   ansible-playbook -i inventory/hosts.yml playbooks/site.yml --check   # dry run
#   ansible-playbook -i inventory/hosts.yml playbooks/site.yml           # converge
#
- name: "HerdR Engineering fleet bootstrap"
  hosts: herdr_fleet
  gather_facts: false
  # become is evaluated before fact gathering, so use the connection user /
  # controller env USER rather than the ansible_user_id fact.
  become: "{{ (ansible_user | default(lookup('env', 'USER'), true)) != 'root' }}"
  vars:
    # State/config live in the FLEET user's home (the user who runs herdr-eng),
    # not root's — captured via a no-become fact gather below (fleet_home).
    herdr_engineering_state_dir: "{{ fleet_home }}/.local/share/herdr-engineering"
    herdr_engineering_artifact_dir: "{{ fleet_home }}/.local/share/herdr-engineering/artifacts"
    # machine-local config (XDG config home) — matches scripts/install.sh and
    # herdr_engineering.config._discover_config_paths()
    herdr_engineering_config_dir: "{{ fleet_home }}/.config/herdr-engineering"
    herdr_engineering_config_file: "{{ herdr_engineering_config_dir }}/config.yaml"
    herdr_pinned_version: "0.9.1"
    llm_endpoint: "https://llm.metabolomics.us"

  tasks:
    - name: "Gather facts as the connection user (no become)"
      ansible.builtin.setup:
      become: false

    - name: "Record the fleet user's home + uid for paths/ownership"
      ansible.builtin.set_fact:
        fleet_home: "{{ ansible_env.HOME }}"
        fleet_user: "{{ ansible_user_id }}"

    - name: "Include platform-specific role (Linux vs macOS)"
      ansible.builtin.include_role:
        name: "{{ 'herdr_linux' if ansible_facts['system'] == 'Linux' else 'herdr_macos' }}"

    - name: "Create HerdR Engineering state + artifact directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
        owner: "{{ fleet_user }}"
      loop:
        - "{{ herdr_engineering_state_dir }}"
        - "{{ herdr_engineering_artifact_dir }}"

    - name: "Create HerdR Engineering config directory"
      ansible.builtin.file:
        path: "{{ herdr_engineering_config_dir }}"
        state: directory
        mode: "0750"
        owner: "{{ fleet_user }}"

    - name: "Ensure HerdR Engineering config references the lab LLM endpoint"
      ansible.builtin.lineinfile:
        path: "{{ herdr_engineering_config_file }}"
        line: "llm_endpoint: {{ llm_endpoint }}"
        create: true
        mode: "0640"

    - name: "Tailscale reachability check (informational, non-fatal)"
      ansible.builtin.command: tailscale status
      register: tailscale_status
      changed_when: false
      ignore_errors: true

    - name: "Report Tailscale state"
      ansible.builtin.debug:
        msg: "tailscale: {{ 'up' if tailscale_status.rc == 0 and 'tailscale' in tailscale_status.stdout else 'down/not-logged-in' }}"
