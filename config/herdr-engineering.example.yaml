version: 1

herdr:
  capability_cache_ttl_seconds: 30

web:
  private_only: true

artifacts:
  provider: filesystem
  root: "${HERDR_ENGINEERING_ARTIFACT_ROOT:-~/.local/share/herdr-engineering/artifacts}"
  retention_days: 30

dev_fabric:
  enabled: true
  logical_service_name: dev
  external_port_range: [18000, 28999]
  lease_ttl_seconds: 90
  heartbeat_seconds: 30
  private_only: true
  allowed_protocols: [http, https, tcp]

# Fabric gateway = the unified dev:<port> front door (spec 0110 component #3).
# Run `herdr-eng devfabric gateway` (with a token, see below, or --allow-open) on the gateway host (bender today).
# Registrar commands use it automatically when reachable, and degrade to
# local mode with a warning when it is not. There is no env-var override: a
# central fleet-config.yaml `fabric.url` wins over gateway_url below.
fabric:
  # full control URL (http://host:port) or bare host/MagicDNS name (given the
  # default control port); empty = local/standalone mode
  gateway_url: ""
  control_port: 29999
  # router interfaces: "auto" = loopback + this host's tailnet IP
  bind: auto
  # advertised base for dev:<port> URLs (defaults to the host's MagicDNS name)
  url_base: ""
  probe_interval_seconds: 15
  # token is a secret: set HERDR_ENGINEERING_FABRIC_TOKEN or write it to
  # ~/.config/herdr-engineering/fabric-token (never in this file)
  # no token = the gateway refuses to start unless run with --allow-open (unauthenticated; loopback/private tailnet only;
  # set one before exposing the control port further). In an HA pair give BOTH nodes the same token: a node that
  # cannot read its peer's /healthz with its token pauses HA instead of promoting.

# Host-visible central scheduler settings. Server admission and limits belong
# in the central control_plane section (scheduler_admission defaults false).
# See docs/operations/fabric-scheduler.md for effective flags and rollout gates.
scheduler:
  telemetry: true

# The lineage merge-gate evidence block (control_plane.graph_merge_gate) lives in the CENTRAL fleet file, not this
# per-host file: see deploy/control-plane/fleet-config.example.yaml. It is off by default.

tests:
  adapters: [pytest, go, cargo, junit, scala]

ci:
  provider: woodpecker
  base_url: https://ci.metabolomics.us
  # token is a secret: it lives in the central fleet config (ci.token, set by
  # `herdr-eng fleet config init`), never in this file
  pileated_extensions: auto

notifications:
  enabled: true
  minimum_severity: notice

security:
  allow_public_listeners: false
  persist_hidden_reasoning: false

# On by default (systemd user unit on Linux, launchd job on macOS); scripts/build-cleanup.sh installs it by hand.
# Default roots: ~, ~/work, ~/IdeaProjects, ~/.cache (set `roots` to replace them).
build_cleanup:
  enabled: true
  # roots: [~, ~/work, ~/IdeaProjects, ~/.cache]  # the default; list your own to replace it
  interval_seconds: 900
  high_water_percent: 85
  low_water_percent: 80
  min_age_hours: 24
  max_target_gb: 50  # a target over this, idle for size_cap_idle_hours, is cleaned by the sweep; 0 = off
  size_cap_idle_hours: 2  # minimum 1

# Fabric build cache (spec 02). Everything is OFF by default; invalid values fail
# closed at load (unknown keys, "false" strings, URLs, embedded secrets are errors).
# Secrets are referenced by absolute file PATH only (mode 0600), never embedded.
fabric_build_cache:
  enabled: false              # default false: master switch; off => effective mode local_only
  mode: local_only            # local_only | shared_cache | slurm_full_build | distributed
  allowed_hosts: []           # default none: hosts allowed to use this feature
  shared_cache:
    enabled: false            # default false
    endpoint_ref: null        # identifier from the protected service registry, NOT a URL
    namespace: trusted-dev
    writes_enabled: false     # default false: read-only unless explicitly enabled
    max_total_gib: 250
    tls_required: true        # default true; false only for endpoint_ref "*.local-test". Plain HTTP to loopback/tailnet hosts is accepted regardless
    # Key names keep their S3 spelling for compatibility; the only shared backend is the herdr rustfs server (bucket herdr-build-cache).
    credentials_file: null    # absolute path, mode 0600, owned by the service user
    registry_file: null       # absolute path, mode 0600: YAML service registry mapping endpoint_ref -> host/region/bucket
  local:
    capacity_gib: 20
    ram_scratch_gib: 0
    min_free_disk_percent: 20
    incremental_disabled_for_cacheable_builds: true
  execution:
    slurm_enabled: false      # default false: no remote builds
    allowed_clusters: []      # required non-empty for slurm_full_build/distributed
    allowed_partitions: []    # required non-empty for slurm_full_build/distributed
    gpu_for_cpu_builds: false # default false: true only warns, never recommended
    remote_fallback: local    # local | fail
    max_build_slots: 2        # 1..16
  slurm:                      # spec 11 opt-in, NOT executable today: no runner is verified
    enabled: false            # default false; true also needs account + allowed_partitions
    account: null             # Slurm account NAME only, never a credential
    allowed_partitions: []    # explicit CPU partitions; anything else falls back locally
    cpus: 8                   # 1..128
    mem_gb: 16                # 1..2048
    time_limit_minutes: 60    # 1..1440
    queue_wait_timeout_s: 900 # queue wait before local fallback
  cleanup:
    dry_run: true             # default true: report only, delete nothing
    min_idle_hours: 24
    max_evict_per_pass_gib: 10
  observability:
    enabled: false
    export_existing_metrics_pipeline: false

# GitHub catalog (control-plane-web). The catalog runs only in the control
# plane, which reads these keys from the central fleet file's `github` section
# (next to github.token), live on the next sync pass; they are listed here for
# reference and validated by the same rules wherever they appear.
#   github:
#     values:
#       token: ...                       # set by `herdr-eng fleet config init`
#       organizations: [acme, my-login]  # owner allowlist (orgs + your own account),
#                                        # case-insensitive; empty/absent = every owner.
#                                        # Excluded owners cost no issue calls and their
#                                        # stored rows are purged on the next pass.
#       sync:
#         interval: 300                  # seconds between sync passes
#         full_reconcile_interval: 86400 # each repository is read in full once per this
#                                        # many seconds (staggered), as a drift safety net
#         point_budget: 400              # GraphQL points (rateLimit.cost) one pass may spend;
#                                        # repositories that do not fit are deferred to the
#                                        # next pass (listed as deferred_repos, stale after 2x
#                                        # interval) and the cached rows keep being served
# The catalog persists in control_plane.pg_dsn when it is set (migration 0006),
# otherwise it lives in memory and a restart re-reads GitHub.
