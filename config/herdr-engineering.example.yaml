version: 1

herdr:
  capability_cache_ttl_seconds: 30

web:
  private_only: true

artifacts:
  provider: filesystem
  root: "${HERDR_ENGINEERING_ARTIFACT_ROOT:-~/.local/share/herdr-engineering/artifacts}"
  retention_days: 30

dev_fabric:
  enabled: true
  logical_service_name: dev
  external_port_range: [18000, 28999]
  lease_ttl_seconds: 90
  heartbeat_seconds: 30
  private_only: true
  allowed_protocols: [http, https, tcp]

# Fabric gateway = the unified dev:<port> front door (spec 0110 component #3).
# Run `herdr-eng devfabric gateway` on the gateway host (bender today).
# Registrar commands use it automatically when reachable, and degrade to
# local mode with a warning when it is not. There is no env-var override: a
# central fleet-config.yaml `fabric.url` wins over gateway_url below.
fabric:
  # full control URL (http://host:port) or bare host/MagicDNS name (given the
  # default control port); empty = local/standalone mode
  gateway_url: ""
  control_port: 29999
  # router interfaces: "auto" = loopback + this host's tailnet IP
  bind: auto
  # advertised base for dev:<port> URLs (defaults to the host's MagicDNS name)
  url_base: ""
  probe_interval_seconds: 15
  # token is a secret: set HERDR_ENGINEERING_FABRIC_TOKEN or write it to
  # ~/.config/herdr-engineering/fabric-token (never in this file)
  # empty token = control API unauthenticated (fine on a private tailnet;
  # set one before exposing the control port further)

# Fabric scheduler rollout switches. Telemetry is safe read-only collection;
# admission/all-spawn integration remain opt-in until the canary gates pass.
scheduler:
  telemetry: true
  policy_enforcement: true
  plan_only: true
  admission: false
  all_spawns: false
  migration: false
  telemetry_freshness_seconds: 60
  reservation_ttl_seconds: 90

tests:
  adapters: [pytest, go, cargo, junit, scala]

ci:
  provider: woodpecker
  base_url: https://ci.metabolomics.us
  # token is a secret: it lives in the central fleet config (ci.token, set by
  # `herdr-eng fleet config init`), never in this file
  pileated_extensions: auto

notifications:
  enabled: true
  minimum_severity: notice

security:
  allow_public_listeners: false
  persist_hidden_reasoning: false

# Optional Linux companion: scripts/build-cleanup.sh installs the user service.
# Only runs while a same-user local `herdr server` exists. Explicit roots required.
build_cleanup:
  enabled: false
  roots: []  # e.g. [~/IdeaProjects]
  interval_seconds: 900
  high_water_percent: 85
  low_water_percent: 80
  min_age_hours: 24

# GitHub catalog (control-plane-web). The catalog runs only in the control
# plane, which reads these keys from the central fleet file's `github` section
# (next to github.token), live on the next sync pass; they are listed here for
# reference and validated by the same rules wherever they appear.
#   github:
#     values:
#       token: ...                       # set by `herdr-eng fleet config init`
#       organizations: [acme, my-login]  # owner allowlist (orgs + your own account),
#                                        # case-insensitive; empty/absent = every owner.
#                                        # Excluded owners cost no issue calls and their
#                                        # stored rows are purged on the next pass.
#       sync:
#         interval: 300                  # seconds between sync passes
#         full_reconcile_interval: 86400 # each repository is read in full once per this
#                                        # many seconds (staggered), as a drift safety net
#         point_budget: 400              # GraphQL points (rateLimit.cost) one pass may spend;
#                                        # repositories that do not fit are deferred to the
#                                        # next pass (listed as deferred_repos, stale after 2x
#                                        # interval) and the cached rows keep being served
# The catalog persists in control_plane.pg_dsn when it is set (migration 0006),
# otherwise it lives in memory and a restart re-reads GitHub.
