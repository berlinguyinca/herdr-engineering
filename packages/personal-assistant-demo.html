<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HerdR Personal Assistant — render demo</title>
  <link rel="stylesheet" href="herdr-design-system/theme.css">
  <link rel="stylesheet" href="herdr-design-system/base.css">
  <link rel="stylesheet" href="herdr-web-components/components.css">
  <link rel="stylesheet" href="personal-assistant.css">
  <style>
    body { background: var(--background); padding: 24px; }
    #stage { max-width: 1280px; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script type="module">
    import { HerdrClient } from './herdr-web-client/client.js';
    import { defineComponents } from './herdr-web-components/index.js';
    import { mountPersonalAssistant } from './personal-assistant-view.js';

    defineComponents();

    // ---- mock backend (renders the real view against realistic data) ----
    const db = {
      assistants: [{ assistant_id: 'asst_1', user_id: 'u1', name: 'Personal Assistant', persona: 'helpful', status: 'ready', instructions: 'Be concise.', model_policy: 'auto', enabled: true, created_at: '2026-10-27T10:00:00Z', updated_at: '2026-10-27T10:05:00Z', version: 2 }],
      threads: [{ thread_id: 'thr_1', assistant_id: 'asst_1', title: 'Morning briefing', created_at: '2026-10-27T08:00:00Z', last_activity_at: '2026-10-27T09:30:00Z' }],
      messages: [
        { message_id: 'm1', thread_id: 'thr_1', role: 'user', content: 'Summarize today’s open items from my inbox.', created_at: '2026-10-27T09:00:00Z', provenance: 'direct', visibility: 'visible' },
        { message_id: 'm2', thread_id: 'thr_1', role: 'assistant', content: '[local-skeleton runner v1]\nRelevant memory:\n- User prefers concise morning briefings.\n\nHere are today’s open items: 2 calendar events, 1 high-priority email, 0 open missions needing review.', created_at: '2026-10-27T09:00:03Z', provenance: 'run_9', visibility: 'visible' },
      ],
      grants: [{ grant_id: 'g1', assistant_id: 'asst_1', tool_id: 'browse', scope: '*', expires_at: '2026-11-27T00:00:00Z', revoked_at: null, created_at: '2026-10-27T10:00:00Z', constraints: {} }],
      approvals: [{ approval_id: 'appr_1', assistant_id: 'asst_1', actor_id: 'u1', decision: 'pending', expires_at: '2026-10-27T12:00:00Z', policy_snapshot: 'send_message:*', created_at: '2026-10-27T10:30:00Z', action_id: 'act_1' }],
      memory: [{ memory_id: 'mem_1', assistant_id: 'asst_1', namespace: 'private', content: 'User prefers concise morning briefings.', source_ref: 'chat', classification: 'general', created_at: '2026-10-27T09:00:00Z', updated_at: '2026-10-27T09:00:00Z', revision: 1 }],
    };
    db.routines = [{ routine_id: 'rout_1', assistant_id: 'asst_1', name: 'Morning briefing', trigger_type: 'daily', trigger_spec: { time: '09:00' }, timezone: 'UTC', quiet_hours: null, enabled: true, last_result: 'triggered', last_run_at: '2026-10-27T09:00:00Z', next_at: '2026-10-28T09:00:00Z', created_at: '2026-10-27T08:00:00Z', updated_at: '2026-10-27T09:00:00Z' }];
    const tools = [
      { tool_id: 'chat', description: 'Respond in conversation.', sensitive: false, granted: true },
      { tool_id: 'read_memory', description: 'Read the user’s assistant memory.', sensitive: false, granted: true },
      { tool_id: 'browse', description: 'Fetch a web page for research.', sensitive: false, granted: true },
      { tool_id: 'run_shell', description: 'Execute a shell command.', sensitive: true, granted: false },
      { tool_id: 'send_message', description: 'Send an external message.', sensitive: true, granted: false },
    ];
    const fetchImpl = async (url, opts = {}) => {
      const method = opts.method || 'GET';
      const path = url.split('?')[0];
      let json = {};
      const asst = () => db.assistants[0];
      const is = (p) => path === p || path.startsWith(p + '/');
      if (method === 'GET' && path === '/api/v1/assistants') json = { assistants: db.assistants };
      else if (method === 'GET' && is('/api/v1/assistants/') && path.endsWith('/permissions')) json = { tools, grants: db.grants };
      else if (method === 'GET' && is('/api/v1/assistants/') && path.endsWith('/memory')) json = { memory: db.memory };
      else if (method === 'GET' && path === '/api/v1/assistant-approvals') json = { approvals: db.approvals };
      else if (method === 'GET' && path === '/api/v1/assistant-routines') json = { routines: db.routines };
      else if (method === 'GET' && is('/api/v1/assistants/') && path.endsWith('/threads')) json = { threads: db.threads };
      else if (method === 'GET' && path.includes('/threads/')) json = { thread: db.threads[0], messages: db.messages };
      else if (method === 'GET' && is('/api/v1/assistants/') && path.endsWith('/diagnostics')) json = { assistant_id: 'asst_1', enabled: true, status: 'ready', model_policy: 'auto', runner: 'LocalRunnerAdapter', runner_version: 1, tool_count: 5, active_grants: 3, pending_approvals: 1, thread_count: 1, run_count: 12, memory_count: 1 };
      else if (method === 'POST' && path === '/api/v1/assistants') { const b = JSON.parse(opts.body); json = { ...asst(), ...b }; }
      else if (method === 'POST' && path.endsWith('/threads')) json = { thread_id: 'thr_new', assistant_id: 'asst_1', title: 'New conversation', created_at: '2026-10-27T10:00:00Z', last_activity_at: '2026-10-27T10:00:00Z' };
      else if (method === 'POST' && path.endsWith('/messages')) json = { run: { run_id: 'run_10', thread_id: db.threads[0].thread_id, state: 'completed', model_route: 'auto', version: 2 } };
      else if (method === 'POST' && path.includes('/memory')) json = { memory_id: 'mem_new', assistant_id: 'asst_1', namespace: 'private', content: 'stored', source_ref: 'ui', classification: 'general', created_at: '2026-10-27T10:00:00Z', updated_at: '2026-10-27T10:00:00Z', revision: 1 };
      else if (method === 'POST' && path.includes('/decision')) json = { approval_id: 'appr_1', decision: 'approved' };
      else if (method === 'POST' && path.endsWith('/memory/export')) json = { assistant_id: 'asst_1', exported_at: '2026-10-27T10:00:00Z', count: 1, memory: db.memory };
      else json = { ok: true };
      return { ok: true, status: 200, headers: { get: () => null }, text: async () => JSON.stringify(json) };
    };
    const client = new HerdrClient('', { fetchImpl, user: 'u1', tenant: 't1' });
    mountPersonalAssistant(document.getElementById('stage'), client);
  </script>
</body>
</html>
