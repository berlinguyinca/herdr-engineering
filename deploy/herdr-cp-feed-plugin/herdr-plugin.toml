id = "herdr.cp-feed"
name = "HerdR Control-Plane Feed"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Emit herdr workspace/agent lifecycle events to the HerdR control plane (/api/v1/ingest)"
platforms = ["linux", "macos"]

[[startup]]
command = ["node", "emit.js"]

# ---- host ----
[[events]]
on = "workspace.focused"
command = ["node", "emit.js"]

[[events]]
on = "workspace.created"
command = ["node", "emit.js"]

# ---- mission (workspace) ----
[[events]]
on = "workspace.renamed"
command = ["node", "emit.js"]

[[events]]
on = "workspace.closed"
command = ["node", "emit.js"]

# ---- session (pane / agent) ----
[[events]]
on = "pane.created"
command = ["node", "emit.js"]

[[events]]
on = "pane.agent_detected"
command = ["node", "emit.js"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "emit.js"]

[[events]]
on = "pane.focused"
command = ["node", "emit.js"]

[[events]]
on = "pane.exited"
command = ["node", "emit.js"]

[[events]]
on = "pane.closed"
command = ["node", "emit.js"]
