# always-on-review.py configuration. Copy to ~/.config/herdr-engineering/always-on-review.yaml, pass with --config.
# YAML only: no environment variables. Unknown keys are refused. No secrets belong here: gh uses its own login, the
# claude backend uses the operator's Claude Code login, the pi backend uses ~/.pi/agent/models.json.
#
# DRY-RUN IS THE DEFAULT. Nothing is posted (no status, no comment) unless `post: true` below AND the command line
# passes --post. A dry run still runs the reviewers and writes state_dir/reviews.jsonl.

repos:                                   # example: what `poll` watches when no --repo is given
  - berlinguyinca/herdr-engineering
state_dir: ~/.local/state/herdr-review   # locks, state.json (cooldowns), reviews.jsonl (one line per review), worktrees/
post: false                              # key 1 of 2 for posting; key 2 is the --post flag
clone: ~/IdeaProjects/herdr-engineering  # a clone with `origin` = GitHub; claude/pi get a detached worktree of the PR head

# By default tier 2 reviews a head without waiting for its checks. Set wait_for_green: true to restore the
# green-only gate: tier 2 then runs only on a head whose gates are green on that exact SHA (commit status context
# or check-run name). required/when_present are read only when wait_for_green is true.
#   required:     each name must be PRESENT and success. neutral/skipped is NOT green. Empty is refused for tier 2.
#   when_present: optional checks (some pipelines only run on some PRs): absent is fine, neutral/skipped is fine,
#                 but if the check exists it must be success; pending or failed blocks tier 2.
gates:
  wait_for_green: false                  # true = review only green heads (then `required` must not be empty)
  required:
    - ci/woodpecker/pr/artifact-handoff
    - ci/woodpecker/pr/structural-gates
    - ci/woodpecker/pr/unit-gates
    - verify
    - GitGuardian Security Checks
  when_present:
    - ci/woodpecker/pr/ui-gates

poll:
  max_per_run: 5                         # reviews started per poll; one runs at a time (lock), so concurrency is 1
  pending_stale_minutes: 120             # a pending status older than this (a crashed run) is reviewed again
  cooldown_failures: 3                   # a PR+tier whose review fails this many times in a row ...
  cooldown_minutes: 60                   # ... is not retried for this long (the status stays pending meanwhile)

# Backend and model per tier. The backend names a block under `backends:`; `model` is passed to that backend.
tiers:
  tier1:                                 # advisory: never posts the required context
    enabled: true
    context: Open-weight pre-review
    backend: pi                          # gateway | claude | pi
    model: metabolomics/qwen3.8-27b      # pi: provider/alias or id from `pi --list-models` (see README)
    time_cap_s: 900
    comment: false                       # true: one marked PR comment when it blocks; with pi it is REFUSED unless
                                         # backends.pi.wrapper is set (pi has no file sandbox; see README)
  tier2:                                 # the required check, only for mergeable heads
    enabled: true
    context: Opus agent review
    backend: claude
    model: opus                          # claude: any --model value (alias or full id)
    time_cap_s: 3600                     # ONE cap shared by all passes: each pass may use an equal share of what is left
                                         # (four passes ~ 900 s each; unused time passes on to the later ones)
    comment: true                        # one marked PR comment (updated in place) when it blocks
    # daily_budget_usd: 25               # optional; unset = no limit. Before each review the poller sums this tier's
                                         # cost_usd in state_dir/reviews.jsonl since 00:00 UTC; at or over the budget the
                                         # review is skipped (one log line, status left as it is, even with --force).
                                         # Finished reviews are never affected. Must be a positive number.
    passes:                              # one sequential claude run per pass; `passes: []` = one unfocused review
      - {name: general, focus: "Review the change as a whole: correctness, design, and anything the other passes would miss."}
      - {name: tests, focus: "Focus on the tests: isolation, order dependence, global state, resource leaks, and whether they prove the change."}
      - {name: security, focus: "Focus on security: secrets, untrusted input reaching a shell, SQL or path, permissions, and roles."}
      - {name: migrations, focus: "Focus on schema and config migrations: rollback safety, indexes versus queries, defaults, and restart keys."}

# Codex second reviewer for risky paths (the spec's "Independence trade-off"). Opus reviewing Claude-authored PRs
# loses the different-family rule, so a PR that touches any path matching `globs` also needs a Codex verdict:
# `Opus agent review` is posted success only when Opus AND Codex approve (a Codex block posts failure with its
# findings). Opus runs first; Codex only runs if Opus approved cleanly, in a read-only sandbox on the same worktree.
# If Codex cannot run (not installed or not logged in, time cap, bad exit, malformed answer, a block whose blockers
# cannot be verified, spend it cannot count) the status stays pending: never success on failure to run.
# PRs that match nothing never call Codex. `globs: []` (the default) turns the feature off. A rename counts by its old
# and new path. Matching is case-insensitive; `**/` = any directories (or none), `*` stays inside one path segment.
risky:
  globs:
    - "deploy/**"
    - "**/migrations/**"
    - "**/*.sql"
    - "**/*security*/**"
    - "**/*auth*"
    - "**/*auth*/**"                     # auth directories (the line above only matches a path's last segment)
    - "**/secrets*"
  codex:
    command: codex                       # needs `codex login` on the host; the user's config.toml is ignored (--ignore-user-config)
    wrapper: []                          # optional sandbox prefix, as for claude
    model: ""                            # "" = the codex CLI's own default model
    time_cap_s: 1800
    diff_bytes: 200000                   # the diff and commit log are in the prompt; cut here
    # daily_budget_usd: 10               # optional; unset = no limit. codex reports tokens, not dollars, so the cost is
    # input_usd_per_mtok: 2              # computed from these two prices (cached input counts as full input) and logged
    # output_usd_per_mtok: 10            # in reviews.jsonl with tier "codex". Both prices are REQUIRED with a budget.
                                         # Summed since 00:00 UTC like tier2's budget: at or over it, a risky PR's review
                                         # is skipped BEFORE Opus runs (status unchanged, even with --force).

prompt:
  checklist_file: review-checklist.yaml   # relative paths resolve against this file; use an absolute path once copied elsewhere
  require_evidence: true                 # a blocking finding needs a meaningful quote (>= 20 chars, or a whole line of >= 12 that is not boilerplate like `except Exception:`) found in the cited
                                         # file's hunks or at head, plus a how_it_fails, else it becomes a note; if the model said
                                         # block and ALL its blockers were downgraded, tier 2 stays pending (never success)
  # replay.reviewers (below `replay:`): extra logins, bots included, whose review comments `corpus build` counts
  project_rules:                         # trusted instructions, added to both tiers' system prompt
    - "TDD: every change ships with a test that fails without it."
    - "No mocks, stubs, or fakes in tests; use real dependencies."
    - "Configuration is YAML only; no environment variables."
    - "Every Postgres schema change needs a migration; queries are parameterized only."
    - "Strict typing: TypeScript has no `any`; Scala 3 uses immutable data."
    - "Prefer MessagePack or Protobuf over JSON for API traffic."
    - "No secrets or passwords in the repo, logs, or errors."
    - "Mass tolerances are written in mDa or Da, never ppm."
    - "Every changed default or new config key is documented in CHANGELOG with its rollback."
    - "A new restart-required config key is listed where the restart keys are enumerated."

replay:
  clones: []                             # [{repo: OWNER/NAME, path: ~/clone}] per-repo clones for replay; else `clone`

backends:
  gateway:                               # the OpenAI-compatible call of ai-review.py; same keys as its `reviewer:`
    pi_provider: metabolomics
    models_file: ~/.pi/agent/models.json
    chunk_bytes: 24000
    thinking: false
    response_format: json_schema
    timeout_s: 900
    deadline_s: 1800
    retries: 4
    allow_plain_http_hosts: []
  claude:
    command: claude
    wrapper: []                          # optional prefix, e.g. ["bwrap", "--ro-bind", "/", "/", ...] for a sandbox
    max_turns: 40
    diff_bytes: 200000                   # the diff and commit log are in the prompt (no shell); cut here
  pi:
    command: pi
    wrapper: []
    thinking: "off"                      # pi --thinking level
    diff_bytes: 60000                    # the diff is in the prompt (pi has no shell); cut here
