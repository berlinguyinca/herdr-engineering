# ai-review.py configuration. Copy to ~/.config/herdr-engineering/ai-review.yaml and pass it with --config.
# Every key is optional; these are the defaults unless marked "example". Unknown keys are refused.
# No secrets belong here. gh uses its own login. The gateway key is read from the pi provider config named below,
# on the host that runs the script.

repos:                                   # example: what `poll` watches when no --repo is given
  - berlinguyinca/herdr-engineering

state_dir: ~/.local/state/herdr-ai-review   # locks only

# The author's model family when no commit has a Co-Authored-By trailer naming a model.
author_default_family: claude

reviewer:
  pi_provider: metabolomics              # provider in models_file: its https baseUrl and apiKey are used
  models_file: ~/.pi/agent/models.json
  # An id the gateway advertises (GET {baseUrl}/models), exactly. Its family (deepseek, qwen, ...) must differ from
  # every author family; the status names the id the gateway reports having used.
  model: deepseek_v4-flash-modality-text-quant-mxfp4
  max_tokens: 32768                      # reasoning models think first; too little gives finish_reason=length
  # false sends chat_template_kwargs.enable_thinking=false. With thinking on, deepseek spent all 32768 tokens
  # reasoning on 24 KB chunks (finish_reason=length, so the chunk fails); with it off, 15-30 s per chunk.
  thinking: false
  temperature: 0.2
  response_format: json_schema           # json_schema | json_object | none (the gateway accepts json_schema)
  timeout_s: 900                         # longest silence on the connection
  deadline_s: 1800                       # longest one streamed answer may take
  retries: 4                             # extra attempts on 429, 5xx and connection errors
  backoff_s: 5                           # doubles each retry; a Retry-After header wins (capped at 60 s)
  parallel: 1                            # chunks in flight at once; the gateway is shared

# A request is about chunk_bytes + context_bytes_per_chunk + the PR description. Measured on the gateway: 16 KB
# prompts answered in 1-3 min; a 64 KB one was still reasoning after 13 min. Keep requests small.
chunk_bytes: 24000                       # diff bytes per request; files stay together, big files split by hunk
context_bytes_per_file: 12000            # each changed (not new) file's full text at the head SHA, cut at this
context_bytes_per_chunk: 24000           # all full-file context in one request, cut at this; 0 = none
skip_globs: ["*.lock", "package-lock.json", "pnpm-lock.yaml", "go.sum", "*.min.js", "*.map", "dist/*",
             "vendor/*", "node_modules/*", "*.png", "*.jpg", "*.pdf", "*.zip", "*.gz", "*.sif"]   # example (shortened)
post_pending: true                       # "Review running (model)" for the pinned SHA while it works
visual_review: false                     # there is no visual step; true is refused

poll:
  pending_stale_minutes: 120             # a pending status older than this (a crashed run) is reviewed again
  max_per_run: 10
  skip_drafts: false
