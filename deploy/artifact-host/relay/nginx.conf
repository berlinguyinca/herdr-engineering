# One-way relay between herdr-cp-web (the dashboard) and artifact-host-internal.
#
# WHY: the internal role must be unable to open a connection to the dashboard, and the dashboard must not share a network
# with a container that parses member-controlled bytes.  So the dashboard joins only `artifact-relay`; this relay is the
# only container on both `artifact-relay` and `artifact-internal`.  It accepts GET /v1/... (the library client's whole
# surface), passes the dashboard's bearer key through unread (the internal role authenticates it, this relay holds no key),
# and answers 404 to everything else, including the health route.  It never initiates a connection toward the dashboard.
#
# Rendered by nobody: mounted as-is by deploy/artifact-host/compose.yaml (read-only rootfs, tmpfs for the pid and temp paths).
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  access_log off;
  server_tokens off;
  client_body_temp_path /var/cache/nginx/body;
  proxy_temp_path /var/cache/nginx/proxy;
  fastcgi_temp_path /var/cache/nginx/fastcgi;
  uwsgi_temp_path /var/cache/nginx/uwsgi;
  scgi_temp_path /var/cache/nginx/scgi;

  # Docker's embedded DNS; the internal role's address changes when it is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream artifact_host_internal {
    zone artifact_host_internal_up 64k;
    server artifact-host-internal:8091 resolve max_conns=64;
    keepalive 8;
  }

  server {
    listen 8091;
    client_max_body_size 1k;      # GET only: there is nothing to upload
    client_header_buffer_size 4k;
    large_client_header_buffers 2 8k;

    location /v1/ {
      limit_except GET { deny all; }          # GET (and HEAD); every other method is 403
      proxy_pass http://artifact_host_internal;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Host $host;
      proxy_connect_timeout 3s;
      proxy_read_timeout 60s;
      # Stream: with buffering on, a blob larger than the 16m cache tmpfs read by a slow client fills the tmpfs and is cut short.
      proxy_buffering off;
    }

    location = /relay-healthz { return 200 "ok\n"; }   # the container's healthcheck; reveals nothing

    location / { return 404; }
  }
}
