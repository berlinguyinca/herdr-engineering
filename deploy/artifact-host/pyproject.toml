# The artifact host's own manifest (the host ships only in deploy/artifact-host/Dockerfile,
# never in the control-plane wheel). Keep version in step with herdr_artifact_host.__version__.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-artifact-host"
version = "0.1.0"
description = "Standalone Herdr artifact host"
requires-python = ">=3.12"
dependencies = ["nh3==0.3.7", "PyJWT[crypto]>=2.8", "cryptography>=42", "asyncpg>=0.29", "aiohttp==3.13.5"]

[project.scripts]
herdr-artifact-host = "herdr_artifact_host.cli:main"

[tool.setuptools.packages.find]
include = ["herdr_artifact_host*"]

[tool.setuptools.package-data]
herdr_artifact_host = ["share_static/*", "share_static/*/*", "share_static/*/*/*", "migrations/*.sql"]
