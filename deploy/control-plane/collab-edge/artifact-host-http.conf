  # ---- artifact host (member-owned artifacts), spliced in by deploy.sh INSTEAD of share-http.conf + member-http.conf
  # when control_plane.artifact_host.enabled. One public name (@artifact_host@) serves /s/ (share links), /api/member/,
  # / and /my/ (the member page) and /mcp/artifacts, all to artifact-host-public:8090 over the artifact-edge network.
  # NEVER proxied: /healthz (the health listener is loopback-only inside the container) and /internal/ (the dashboard
  # listener lives on artifact-internal, which the edge is not attached to); both are this server's own 404.
  # Own per-client limits: a share download must not eat the collaboration budget, and the other way round.
  limit_req_zone $remote_addr zone=share_req:10m rate=100r/s;
  limit_conn_zone $remote_addr zone=share_conn:10m;
  # Annotation writes (a person typing): far below the read budget, and its own zone so reads cannot starve them.
  limit_req_zone $remote_addr zone=share_annotate:10m rate=5r/s;
  # The member web UI and API: their own zones (the share zones are for /s/), so uploads cannot starve /s/.
  limit_req_zone $remote_addr zone=member_req:10m rate=10r/s;
  limit_conn_zone $remote_addr zone=member_conn:10m;
  # Reads everywhere under /s/; POST only for the lab sign-in exchange (no body) and the annotation endpoints.
  map "$request_method:$uri" $share_method_ok {
    default 0;
    "~^(GET|HEAD|OPTIONS):/s/" 1;
    "~^POST:/s/[A-Za-z0-9_-]{43}/session\z" 1;   # \z: a decoded trailing %0A cannot satisfy it
    "~^POST:/s/[A-Za-z0-9_-]{43}/k/[A-Za-z0-9_.-]{1,768}/annotations(/ann_[A-Za-z0-9_-]{22}/(edit|delete))?\z" 1;
  }
  # /api/member/: reads and writes everywhere, DELETE only for the two routes the app defines (a folder, and unfiling an
  # item from one). Any other DELETE is this server's own 404 and never reaches the app. \z as above.
  map "$request_method:$uri" $member_method_ok {
    default 0;
    "~^(GET|POST|PUT):/api/member/" 1;
    "~^DELETE:/api/member/folders/[A-Za-z0-9_-]+(/items/[A-Za-z0-9_-]+)?\z" 1;
  }
  # A request provably without a body: no Transfer-Encoding and no (or a zero) Content-Length.
  map "$http_transfer_encoding:$http_content_length" $share_has_body {
    default 1;
    ":" 0;
    ":0" 0;
  }
  # proxy_pass without a URI forwards the RAW request line, while locations and the maps above see the normalised
  # $uri: refuse anything where the two could differ (empty or dot segments, escaped slash, dot or backslash).
  # Ordinary escapes such as %20 in a file name are fine.
  map $request_uri $share_raw_path_ok {
    default 1;
    "~*^[^?]*(//|/\.\.?(/|$|\?)|%2e|%2f|%5c|\x5c)" 0;
  }
  # Reads carry no body (the annotation location admits one for POST only).
  map "$request_method:$http_transfer_encoding:$http_content_length" $share_read_with_body {
    default 0;
    "~^(GET|HEAD)::0?$" 0;
    "~^(GET|HEAD):" 1;
  }
  # artifact-host-public is resolved at RUN time (Docker's DNS), never at start/reload: the edge (collab, MCP, cert
  # reloads) starts and reloads while the host is down; the host's routes then answer 502 until it is back.
  # The public role refuses more than 128 connections IN TOTAL. A single upstream let one route (a slow /s/ download, a
  # stalled upload) take them all and starve the member page, so each route family has an upstream (and so a connection
  # budget and idle pool) of its own: max_conns caps what the edge opens to the role, and the budgets sum to 124 < 128,
  # which leaves the role four connections for its own health probe and a restart race.
  #   share   /s/ and annotations          52   (downloads: the long ones)
  #   member  /, /my/, /api/member/        40   (the page and its API: what a signed-in person waits on)
  #   upload  .../runs/N (16 MiB streams)  16   (a stalled upload holds its slot for client_body_timeout, not the page's)
  #   mcp     /mcp/artifacts               16   (the MCP server's route, same upstream zone rules)
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream artifact_host_share  { zone artifact_host_share_up  64k; server artifact-host-public:8090 resolve max_conns=52; keepalive 8; }
  upstream artifact_host_member { zone artifact_host_member_up 64k; server artifact-host-public:8090 resolve max_conns=40; keepalive 8; }
  upstream artifact_host_upload { zone artifact_host_upload_up 64k; server artifact-host-public:8090 resolve max_conns=16; keepalive 2; }
  upstream artifact_host_mcp    { zone artifact_host_mcp_up    64k; server artifact-host-public:8090 resolve max_conns=16; keepalive 4; }

  # The artifact host: a server of its own (the MCP host serves no /s/ at all). It presents the edge's ONE certificate
  # (a SAN certificate naming both hosts, the same /etc/acme mount as the MCP server above). Only /s/ is proxied;
  # everything else is a 404. Nothing here adds caching or response headers: the host's Cache-Control: no-store
  # on the viewer pages, its CSP and nosniff reach the browser unchanged.
  server {
    listen 8443 ssl proxy_protocol;
    server_name @artifact_host@;
    ssl_certificate     /etc/acme/fullchain.pem;
    ssl_certificate_key /etc/acme/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    if ($hcn_from_edge = 0) { return 444; }

    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: never trust a client-supplied value
    proxy_set_header X-Forwarded-Host "";            # an empty value drops the header: it cannot name another host
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Origin $http_origin;            # the annotation POST checks Origin and Sec-Fetch-*
    proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
    proxy_connect_timeout 3s;

    # Tokens and session HMACs are in the path: no access log, and upstream errors only at crit (warn would log the
    # request line). Method/body refusals here are an nginx 404 (not byte-identical to the app's), rate limits a 429,
    # an unreachable host a 502; everything the app refuses is its own single 404. Range is passed as is.
    # A plain prefix (not ^~): the annotation location below is a regex and must win for its own paths.
    location /s/ {
      access_log off;
      error_log /dev/stderr crit;
      if ($share_raw_path_ok = 0) { return 404; }
      if ($share_method_ok = 0) { return 404; }
      if ($share_has_body) { return 404; }
      limit_req zone=share_req burst=300 nodelay;
      limit_conn share_conn 16;
      client_max_body_size 1k;
      proxy_pass_request_body off;
      proxy_buffering off;               # large files stream straight through
      proxy_read_timeout 600s;
      proxy_pass http://artifact_host_share;
    }
    # Annotation reads and writes: the only place a request body reaches the host. Small JSON bodies.
    # (The pattern is quoted: nginx reads a bare brace in a token as a block start.)
    location ~ "^/s/[A-Za-z0-9_-]{43}/k/[A-Za-z0-9_.-]{1,768}/annotations(/ann_[A-Za-z0-9_-]{22}/(edit|delete))?$" {
      access_log off;
      error_log /dev/stderr crit;
      if ($share_raw_path_ok = 0) { return 404; }
      if ($request_method !~ ^(GET|POST)$) { return 404; }
      if ($share_read_with_body) { return 404; }
      if ($share_method_ok = 0) { return 404; }
      limit_req zone=share_annotate burst=30 nodelay;
      limit_conn share_conn 16;
      client_max_body_size 32k;
      proxy_pass_request_body on;
      proxy_buffering off;
      proxy_read_timeout 60s;
      proxy_pass http://artifact_host_share;
    }
    # The member web UI and API (artifact-host-public): the same host serves the signed-in member's page
    # (/ and /my/) and /api/member/. The app does its own Host, Origin, framing and size checks; the session travels in
    # Authorization (never a cookie). Own request and connection zones (member_req, member_conn: see the zones above),
    # so uploads cannot starve /s/ and the other way round. No access log: the session exchange carries a token.
    # A location-level add_header replaces the inherited ones, so HSTS is repeated; the app's own X-Frame-Options is
    # hidden and replaced by the edge's, so the header is sent exactly once.
    location /api/member/ {
      access_log off;
      error_log /dev/stderr crit;
      if ($share_raw_path_ok = 0) { return 404; }
      if ($member_method_ok = 0) { return 404; }
      limit_req zone=member_req burst=60 nodelay;
      limit_conn member_conn 16;
      client_max_body_size 1m;
      proxy_hide_header X-Frame-Options;
      add_header X-Frame-Options "DENY" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      proxy_buffering off;
      proxy_read_timeout 60s;
      proxy_pass http://artifact_host_member;
      # A run upload is up to 32 chunks of 512 KiB (members_config http_chunks_per_request <= 32) = 16 MiB plus slack,
      # streamed to artifact-host-public (never buffered here). Nothing else under /api/member/ takes more than 1 MiB.
      location ~ "^/api/member/artifacts/[A-Za-z0-9_-]+/uploads/[A-Za-z0-9_-]+/runs/[0-9]+\z" {
        access_log off;
        error_log /dev/stderr crit;
        if ($share_raw_path_ok = 0) { return 404; }       # rewrite-module ifs are not inherited by a nested location
        if ($request_method !~ ^PUT$) { return 404; }
        limit_req zone=member_req burst=60 nodelay;
        limit_conn member_conn 16;
        client_max_body_size 17m;
        client_body_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://artifact_host_upload;
      }
    }
    location = / {
      access_log off;
      if ($request_method !~ ^GET$) { return 404; }
      limit_req zone=member_req burst=60 nodelay;
      limit_conn member_conn 16;
      client_max_body_size 1k;
      proxy_hide_header X-Frame-Options;
      add_header X-Frame-Options "DENY" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      proxy_pass http://artifact_host_member;
    }
    location /my/ {
      access_log off;
      if ($request_method !~ ^GET$) { return 404; }
      if ($share_raw_path_ok = 0) { return 404; }
      limit_req zone=member_req burst=60 nodelay;
      limit_conn member_conn 16;
      client_max_body_size 1k;
      proxy_hide_header X-Frame-Options;
      add_header X-Frame-Options "DENY" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      proxy_pass http://artifact_host_member;
    }
    # Operational endpoints are never forwarded (explicit, so a later broad location cannot start proxying them).
    location ~ ^/(healthz|internal)(/|$) { return 404; }
    location / { return 404; }
  }
