  # ---- the member web UI's own origin (control_plane.artifact_host.member_host), appended by render-edge right after the
  # artifact host's server and ONLY when member_host is set. Same certificate, same listener, same upstreams and limit
  # zones as that server, but it routes the member UI alone: = /, /my/ and /api/member/. It never proxies /s/ (share
  # links and uploaded bundles stay on the artifact host's own origin), and everything else is this server's own 404.
  # The app tells the two names apart by Host and adds Cross-Origin-Opener-Policy on this one.
  server {
    listen 8443 ssl proxy_protocol;
    server_name @member_host@;
    ssl_certificate     /etc/acme/fullchain.pem;
    ssl_certificate_key /etc/acme/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    if ($hcn_from_edge = 0) { return 444; }

    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;      # the client's Host as sent: $host would lowercase it and drop the port, defeating the app's exact match
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: never trust a client-supplied value
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
    proxy_connect_timeout 3s;

    location /api/member/ {
      access_log off;
      error_log /dev/stderr crit;
      if ($share_raw_path_ok = 0) { return 404; }
      if ($member_method_ok = 0) { return 404; }
      limit_req zone=member_req burst=60 nodelay;
      limit_conn member_conn 16;
      client_max_body_size 1m;
      proxy_hide_header X-Frame-Options;
      add_header X-Frame-Options "DENY" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      proxy_buffering off;
      proxy_read_timeout 60s;
      proxy_pass http://artifact_host_member;
      location ~ "^/api/member/artifacts/[A-Za-z0-9_-]+/uploads/[A-Za-z0-9_-]+/runs/[0-9]+\z" {
        access_log off;
        error_log /dev/stderr crit;
        if ($share_raw_path_ok = 0) { return 404; }
        if ($request_method !~ ^PUT$) { return 404; }
        limit_req zone=member_req burst=60 nodelay;
        limit_conn member_conn 16;
        client_max_body_size 17m;
        client_body_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://artifact_host_upload;
      }
    }
    location = / {
      access_log off;
      if ($request_method !~ ^GET$) { return 404; }
      limit_req zone=member_req burst=60 nodelay;
      limit_conn member_conn 16;
      client_max_body_size 1k;
      proxy_hide_header X-Frame-Options;
      add_header X-Frame-Options "DENY" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      proxy_pass http://artifact_host_member;
    }
    location /my/ {
      access_log off;
      if ($request_method !~ ^GET$) { return 404; }
      if ($share_raw_path_ok = 0) { return 404; }
      limit_req zone=member_req burst=60 nodelay;
      limit_conn member_conn 16;
      client_max_body_size 1k;
      proxy_hide_header X-Frame-Options;
      add_header X-Frame-Options "DENY" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      proxy_pass http://artifact_host_member;
    }
    location ~ ^/(healthz|internal)(/|$) { return 404; }
    location / { return 404; }
  }
