    # Artifact share links (herdr-share-public). Tokens and session HMACs are in the path: no access log, and
    # upstream errors only at crit (warn would log the request line). Every refusal is the app's own 404.
    location ^~ /s/ {
      access_log off;
      error_log /dev/stderr crit;
      if ($share_method_ok = 0) { return 404; }
      if ($share_has_body) { return 404; }
      limit_req zone=share_req burst=60 nodelay;
      limit_conn share_conn 16;
      client_max_body_size 1k;
      proxy_pass_request_body off;
      proxy_buffering off;               # large files stream straight through
      proxy_read_timeout 600s;
      proxy_pass http://share;
    }
