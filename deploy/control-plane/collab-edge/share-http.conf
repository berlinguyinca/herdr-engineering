  # ---- artifact share links (/s/), spliced in by deploy.sh only when control_plane.share.enabled ----
  # Own per-client limits: a share download must not eat the collaboration budget, and the other way round.
  limit_req_zone $remote_addr zone=share_req:10m rate=20r/s;
  limit_conn_zone $remote_addr zone=share_conn:10m;
  # Reads everywhere under /s/; POST only for the lab sign-in exchange, which carries no body.
  map "$request_method:$uri" $share_method_ok {
    default 0;
    "~^(GET|HEAD|OPTIONS):/s/" 1;
    "~^POST:/s/[A-Za-z0-9_-]{43}/session$" 1;
  }
  # A request provably without a body: no Transfer-Encoding and no (or a zero) Content-Length.
  map "$http_transfer_encoding:$http_content_length" $share_has_body {
    default 1;
    ":" 0;
    ":0" 0;
  }
  # share-public refuses more than 128 connections; keep the idle pool well under that.
  upstream share { server share-public:8083; keepalive 16; }
