    # The member web UI and API (collab-public, not share-public): the same host serves the signed-in member's page
    # (/ and /my/) and /api/member/. The app does its own Host, Origin, framing and size checks; the session travels in
    # Authorization (never a cookie). Own request and connection zones (member_req, member_conn: see the zones above),
    # so uploads cannot starve /s/ and the other way round. No access log: the session exchange carries a token.
    # A location-level add_header replaces the inherited ones, so HSTS is repeated; the app's own X-Frame-Options is
    # hidden and replaced by the edge's, so the header is sent exactly once.
    location /api/member/ {
      access_log off;
      error_log /dev/stderr crit;
      if ($share_raw_path_ok = 0) { return 404; }
      if ($request_method !~ ^(GET|POST|PUT)$) { return 404; }
      limit_req zone=member_req burst=60 nodelay;
      limit_conn member_conn 16;
      client_max_body_size 1m;
      proxy_hide_header X-Frame-Options;
      add_header X-Frame-Options "DENY" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      proxy_buffering off;
      proxy_read_timeout 60s;
      proxy_pass http://collab;
      # A run upload is up to 32 chunks of 512 KiB (members_config http_chunks_per_request <= 32) = 16 MiB plus slack,
      # streamed to collab-public (never buffered here). Nothing else under /api/member/ takes more than 1 MiB.
      location ~ "^/api/member/artifacts/[A-Za-z0-9_-]+/uploads/[A-Za-z0-9_-]+/runs/[0-9]+$" {
        access_log off;
        error_log /dev/stderr crit;
        if ($request_method !~ ^PUT$) { return 404; }
        limit_req zone=member_req burst=60 nodelay;
        limit_conn member_conn 16;
        client_max_body_size 17m;
        client_body_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://collab;
      }
    }
    location = / {
      access_log off;
      if ($request_method !~ ^GET$) { return 404; }
      limit_req zone=member_req burst=60 nodelay;
      limit_conn member_conn 16;
      client_max_body_size 1k;
      proxy_hide_header X-Frame-Options;
      add_header X-Frame-Options "DENY" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      proxy_pass http://collab;
    }
    location /my/ {
      access_log off;
      if ($request_method !~ ^GET$) { return 404; }
      if ($share_raw_path_ok = 0) { return 404; }
      limit_req zone=member_req burst=60 nodelay;
      limit_conn member_conn 16;
      client_max_body_size 1k;
      proxy_hide_header X-Frame-Options;
      add_header X-Frame-Options "DENY" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      proxy_pass http://collab;
    }
