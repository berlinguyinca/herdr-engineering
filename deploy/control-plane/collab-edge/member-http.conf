    # The member web UI and API (collab-public, not share-public): the same host serves the signed-in member's page
    # (/ and /my/) and /api/member/. A run upload is up to 32 chunks of 512 KiB, streamed (never buffered here); the
    # app does its own Host, Origin, framing and size checks. The session travels in Authorization (never a cookie).
    location /api/member/ {
      access_log off;
      error_log /dev/stderr crit;
      if ($share_raw_path_ok = 0) { return 404; }
      if ($request_method !~ ^(GET|POST|PUT)$) { return 404; }
      limit_req zone=share_annotate burst=60 nodelay;
      limit_conn share_conn 16;
      client_max_body_size 17m;
      client_body_timeout 60s;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 60s;
      proxy_pass http://collab;
    }
    location = / {
      access_log off;
      if ($request_method !~ ^GET$) { return 404; }
      limit_req zone=share_annotate burst=60 nodelay;
      client_max_body_size 1k;
      proxy_pass http://collab;
    }
    location /my/ {
      access_log off;
      if ($request_method !~ ^GET$) { return 404; }
      if ($share_raw_path_ok = 0) { return 404; }
      limit_req zone=share_annotate burst=60 nodelay;
      client_max_body_size 1k;
      proxy_pass http://collab;
    }
