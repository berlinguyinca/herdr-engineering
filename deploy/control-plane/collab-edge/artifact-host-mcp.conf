    # @artifact_host_mcp@ spliced into the MCP server by render-edge when control_plane.artifact_host.enabled.
    # The agent endpoint (agents reach the host through the MCP name). Same per-IP budget, connection caps and body ceiling as this server's /mcp (the mcp zones and
    # the 96 MiB spool arithmetic in nginx.conf cover both); the host checks the Host header itself.
    location = /mcp/artifacts {
      access_log off;
      if ($request_method !~ ^POST$) { return 404; }
      client_max_body_size 768k;
      limit_req zone=hcn_mcp burst=100 nodelay;
      limit_conn_status 429;
      limit_conn mcpconn 32;
      limit_conn mcptotal 128;
      proxy_read_timeout 120s;
      proxy_buffering off;
      # A proxy_set_header at location level REPLACES the server's whole inherited set, so all of it is repeated here
      # (nginx.conf's MCP server) with the three client-identity headers the role must never see from the client emptied.
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Origin $http_origin;
      proxy_set_header Forwarded "";
      proxy_set_header X-Real-IP "";
      proxy_set_header X-Forwarded-Host "";
      proxy_pass http://artifact_host_mcp;
    }
