
  # The share path's member web host (control_plane.share.member_host): a server of its own that serves ONLY the member
  # UI and API, never /s/ (rendered only when that key is set; the old share host keeps serving them too). Same
  # certificate, listener, limits and headers as the share host above, and the same member locations (collab-public,
  # which answers only this exact Host). Everything else is an nginx 404.
  server {
    listen 8443 ssl proxy_protocol;
    server_name @share_member_host@;
    ssl_certificate     /etc/acme/fullchain.pem;
    ssl_certificate_key /etc/acme/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    if ($hcn_from_edge = 0) { return 444; }

    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: never trust a client-supplied value
    proxy_set_header X-Forwarded-Host "";            # an empty value drops the header: it cannot name another host
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
    proxy_connect_timeout 3s;

    # @member-locations@
    location / { return 404; }
  }
