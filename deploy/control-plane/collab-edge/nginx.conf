# Public edge for the collaboration network (localdev.mcp.metabolomics.us).
# Terminates TLS and forwards ONLY the collaboration surface to the collab-only
# listener of control-plane-web. Everything else is a 404 at this layer too.
# The shared SNI front hands us the raw TLS stream with a PROXY protocol header so
# per-client limits see the real address.
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  server_tokens off;
  limit_req_zone $remote_addr zone=hcn_req:10m rate=10r/s;
  limit_conn_zone $remote_addr zone=hcn_conn:10m;
  real_ip_header proxy_protocol;
  # Only the LAN SNI edge (cubert, which sends the PROXY header) is trusted to name the client, and
  # only it may connect at all; anything else on the LAN that reaches this port is dropped.
  set_real_ip_from 192.168.137.250;
  map $realip_remote_addr $hcn_from_edge { default 0; 192.168.137.250 1; }

  upstream collab { server collab-public:8081; keepalive 16; }
  upstream collab_operator { server collab-public:8082; keepalive 4; }

  server {
    listen 8443 ssl proxy_protocol default_server;
    ssl_reject_handshake on;
    return 444;
  }
  server {
    listen 8443 ssl proxy_protocol;
    server_name localdev.mcp.metabolomics.us;
    ssl_certificate     /etc/acme/fullchain.pem;
    ssl_certificate_key /etc/acme/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    if ($hcn_from_edge = 0) { return 444; }

    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    limit_req zone=hcn_req burst=40 nodelay;
    limit_req_status 429;
    limit_conn hcn_conn 20;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: never trust a client-supplied value
    proxy_set_header Origin $http_origin;
    proxy_connect_timeout 3s;
    proxy_read_timeout 120s;

    location = /mcp { proxy_pass http://collab; proxy_buffering off; }
    # A2A (send-only adapter) and its public discovery document.
    location = /a2a { proxy_pass http://collab; proxy_buffering off; }
    location = /.well-known/agent-card.json { proxy_pass http://collab; }
    location /api/v1/collab/ {
      proxy_pass http://collab;
      proxy_buffering off;               # room event streams are SSE
      proxy_read_timeout 3700s;
    }
    location = / { proxy_pass http://collab; }
    location ~ ^/(collab-app\.js|collab\.css|collab-view\.js|collab-scripts\.js|herdr-web-client/collab\.js|herdr-web-components/util\.js|herdr-design-system/(theme|base)\.css)$ {
      proxy_pass http://collab;
    }
    location / { return 404; }
  }

  # Operator listener: published on the tailnet interface only (compose), plain HTTP like the
  # dashboard. The service re-checks Host (anti DNS-rebinding), Origin and content type itself.
  server {
    listen 8082;
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    limit_req zone=hcn_req burst=40 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header Origin $http_origin;
    proxy_connect_timeout 3s;
    location /api/v1/collab/ { proxy_pass http://collab_operator; proxy_buffering off; }
    location / { return 404; }
  }
}
