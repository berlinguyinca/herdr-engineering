# Boot order for the fabric listener: collab-public publishes the listener on the TAILNET address
# (control_plane.collab.fabric_trust.listen_host). If dockerd starts before tailscaled has that address, binding
# the published port fails, collab-public does not start, and the PUBLIC collab site stays down until someone
# restarts it. This drop-in orders docker after tailscaled and waits (bounded) for the address.
#
# Install (as root, once; deploy.sh warns while it is missing):
#   install -D -m 0644 deploy/control-plane/docker-after-tailscale.conf \
#       /etc/systemd/system/docker.service.d/after-tailscale.conf
#   systemctl daemon-reload          # takes effect at the next docker start/boot; do not restart docker mid-day
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
# Up to 90 s for a tailnet IPv4 address; on timeout docker starts anyway (everything else on the host needs it).
ExecStartPre=/bin/sh -c 'for i in $(seq 1 90); do tailscale ip -4 >/dev/null 2>&1 && exit 0; sleep 1; done; echo "tailnet address not up after 90s; starting docker anyway" >&2; exit 0'
