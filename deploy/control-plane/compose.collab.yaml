# Collaboration network (HCN) overlay for control-plane-web; layered on by deploy.sh
# only when ~/.config/herdr-engineering/collab-enabled exists. The identifiers below
# are public (pool, app clients, hosted-UI domain, callback URL); no secret is configured here.
# Moving hosts: change --collab-public-url and the app client's callback/logout URLs together.
# Internet access: collab-edge below + one SNI line in the host's shared TLS front.
# Tailnet-only alternative: deploy/control-plane/collab-tailscale-serve.sh
services:
  control-plane-web:
    command:
      - "control-plane"
      - "web"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--web-root"
      - "/app/packages"
      - "--allow-open"
      - "--collab-cognito-pool"
      - "us-west-2_GjtcM0PCp"
      - "--collab-cognito-client"
      - "6mcn0idau4b5uhtkd1b2g6c9qg"
      - "--collab-cognito-group"
      - "local.dev"
      - "--collab-cognito-web-client"
      - "6pccn6slplfe3u30g49fuqbqtv"
      - "--collab-cognito-domain"
      - "https://us-west-2gjtcm0pcp.auth.us-west-2.amazoncognito.com"
      - "--collab-public-url"
      - "https://localdev.mcp.metabolomics.us/"
      - "--collab-public-port"
      - "8081"
      - "--collab-public-host"
      - "0.0.0.0"
      - "--collab-require-https"

  # Public edge. Only the shared SNI front on this host talks to it (loopback port);
  # it reaches control-plane-web's collab-only listener (8081, never published).
  # Certificates come from the host's certbot lineage (renewed by its timer, whose
  # deploy hook also reloads this container).
  collab-edge:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: herdr-collab-edge
    restart: unless-stopped
    depends_on:
      - control-plane-web
    # Runs as the owner of the certbot files (0600): with all capabilities dropped,
    # root could not read them.
    user: "${HERDR_COLLAB_CERT_UID:-1000}:${HERDR_COLLAB_CERT_UID:-1000}"
    read_only: true
    tmpfs:
      - /run:uid=${HERDR_COLLAB_CERT_UID:-1000}
      - /var/cache/nginx:uid=${HERDR_COLLAB_CERT_UID:-1000}
    volumes:
      # deploy.sh installs this to a stable path (the build worktree is temporary)
      - ${HERDR_COLLAB_EDGE_CONF:?run deploy.sh}:/etc/nginx/nginx.conf:ro
      - ${HERDR_COLLAB_CERT_DIR:?set HERDR_COLLAB_CERT_DIR in the env file}:/etc/acme:ro
    ports:
      - "127.0.0.1:18444:8443"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
