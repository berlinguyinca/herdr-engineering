# Explicitly managed by summary-model.py; normal deploy.sh never starts this service.
services:
  agent-summary-model:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:8c74db29f1a2bef3f0a331b52c4d6214601dfceed4bee0b94cc48b3b23ff257d
    restart: unless-stopped
    cpus: 4
    mem_limit: 3g
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m
    volumes:
      - type: bind
        source: ${HERDR_SUMMARY_MODEL_DIR:?run summary-model.py}/qwen2.5-1.5b-instruct-q4_k_m.gguf
        target: /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
        read_only: true
        bind:
          create_host_path: false
    command:
      - --model
      - /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
      - --alias
      - qwen2.5-1.5b-instruct-q4_k_m
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --ctx-size
      - '8192'
      - --parallel
      - '1'
      - --cache-ram
      - '256'
      - --threads
      - '4'
      - --threads-batch
      - '4'
      - --n-gpu-layers
      - '0'
      - --jinja
      - --predict
      - '350'
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
networks:
  default:
    external: true
    name: ${HERDR_SUMMARY_NETWORK:?run summary-model.py}
