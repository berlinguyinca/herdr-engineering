# Central fleet configuration. Copy to ~/.config/herdr-engineering/fleet/fleet-config.yaml
# on the control-plane host (the file must be ALONE in that 0700 directory: deploy.sh
# mounts the directory into the containers) and chmod 600. NEVER commit the real file.
# The tools that edit it (fleet join / config token / config revoke) rewrite the YAML,
# which drops comments; keep notes elsewhere. Backups: ../fleet-backups/ (newest 10).
# Every REDACTED value is a placeholder. The revision is computed, not authored.
version: 1

sections:
  # Read only by the control-plane web process; never served to a host.
  control_plane:
    roles: [control-plane]          # must not be "all"
    values:
      pg_dsn: "postgresql://REDACTED:REDACTED@postgres:5432/REDACTED"
      host_aliases: {}              # e.g. {bender: "bender.example.test"}
      # {} = open on the tailnet (the default `fleet config init` writes; the web port is
      # bound to the tailnet interface and runs --allow-open).
      # !!! KEYED MODE IS NOT SUPPORTED YET !!! Adding entries here (key: role, roles
      # viewer | operator | ingest | agent) gates every route but /api/v1/health and the
      # host endpoints. The browser dashboard, the llm-proxy and the emit hook do not
      # send keys yet, so they all get 401 until they do. If you still enable it, put the
      # ingest key in ingest.api_key and the agent key in agent.api_key below.
      api_keys: {}
      rustfs_endpoint: "http://rustfs:9000"
      minio_user: "REDACTED"        # the object store's access key (what the web reads)
      minio_password: "REDACTED"
      rustfs_bucket: "REDACTED"
      ci_actions: false             # true lets operators retry/cancel CI pipelines
      # OPTIONAL: absolute path (as the web container sees it) to a checkout of InferWeave's
      # deploy/pipelines/*.yaml. Read live. Absent: no definitions, and any host token may report
      # deployment events for any component (the Deployments snapshot then carries a warning).
      # Set but invalid: the last valid set stays in use; events are refused (503) only when no
      # set was ever valid.
      # NOTE: release evidence (the release asset's .commit and its ancestry on main) is NOT
      # wired yet. Until it is, every permit answers false ("release not confirmed"), so a host
      # updater with a gate URL (IW_DEPLOY_GATE_URL) freezes on its running version. Wire the
      # evidence before enabling any host gate.
      # deployment_definitions: "/srv/inferweave/deploy/pipelines"
      # OPTIONAL: true enables the audited Deployments actions (POST /api/deployments/force and
      # /ack, operator role). Read live; anything but true is off. Force only records a request the
      # host updaters pick up; the host permit gate (GET /api/deployments/permit) works either way.
      # A force never permits a release that is not confirmed (see the NOTE above).
      deployment_actions: false
      # OPTIONAL: side effects of a deployment failure escalation (all off by default). issues: a
      # GitHub issue per software finding (needs github.token with issue write access).
      # deployment_escalation:
      #   issues: false
      #   assistant: false
      # OPTIONAL: head-bound post-PR review quorum (GET /api/v1/graph/nodes/{pr}/review-quorum).
      # Principal ids are the server-side `key:<digest>` actors; omit the block to turn it off.
      # review_quorum:
      #   required: 2
      #   trusted_head_writers: ["key:REDACTED"]   # who may define a PR's current head / author
      #   reviewers:
      #     "key:REDACTED": {}
      #     "key:REDACTED2": {login: "reviewer-login"}
      #   reviewer_groups: []                       # e.g. [["key:REDACTED", "key:REDACTED2"]] = one person
      # OPTIONAL: the public collaboration container (only when the host has the marker
      # ~/.config/herdr-engineering/collab-enabled). Public identifiers only - deploy.sh
      # hands exactly this mapping (nothing else from this file) to collab-public, and
      # an unknown key is refused. Omit the whole block when collab is not used.
      collab:
        cognito_pool: "us-west-2_REDACTED"           # also read by collab-sync.sh
        cognito_clients: ["REDACTED"]                # allowed app client ids (tokens)
        cognito_group: "local.dev"                   # required cognito:groups membership
        cognito_web_client: "REDACTED"               # browser page app client (Hosted UI, PKCE)
        cognito_domain: "https://REDACTED.auth.us-west-2.amazoncognito.com"
        public_url: "https://collab.example.test/"   # must equal the web client's callback URL
        operator_user: "REDACTED"                    # Cognito username the dashboard's no-sign-in
                                                     # collaboration acts as (required)
        # operator_email: "owner@example.test"       # optional, shown for the operator
        # T15 attention inbox, evidence-based progress, analytics (everything off unless enabled):
        # insights:
        #   enabled: false                 # kill_switch: true turns every route off at once
        #   kill_switch: false
        #   evidence_writers: ["key:ci-service"]   # ONLY these writers' merged/validated marks count as evidence
        #   min_group_size: 5              # aggregates over fewer items are hidden
        #   reads_per_minute: 60
      # OPTIONAL: lineage-graph evidence in the merge gate. OFF unless you uncomment AND set `enabled: true`.
      # It runs after decide_merge for every PR and can only withhold a merge. `evidence_writers` is REQUIRED and
      # must be explicit graph principal ids ("key:<12 hex of sha256(the CI reporter's API key)>"): an empty list,
      # a wildcard or a bare word stops startup (and `fleet-config validate`) instead of enabling anything.
      # Only `validated` edges written by these principals, bound to the PR's exact head SHA, count.
      # See docs/operations/lineage-continuity-runbook.md ("Turning the graph merge gate on").
      # graph_merge_gate:
      #   enabled: false                 # true to turn it on; false/removed = hot kill switch
      #   evidence_writers: ["key:<12-hex-of-the-ci-reporter-key>"]   # REPLACE: the placeholder is refused at startup
      #   required_checks: ["ci"]        # edges name their check in attrs.check (default "ci")
      #   require_review_quorum: false   # true also needs control_plane.review_quorum to be satisfied
      # OPTIONAL: the Personal Assistant (inert unless `enabled: true`). Nothing in
      # the assistant module runs while disabled; the /personal-assistant dashboard
      # view only appears when the `assistant_v1` capability is advertised (enabled).
      # Deny-by-default throughout: tools are never offered to the model unless the
      # user grants them, sensitive tools require an operator approval, and secrets
      # are redacted from prompts, logs and events. Copy only what you need.
      # personal_assistant:
      #   enabled: false                 # master kill-switch (also gates the capability flag)
      #   # Off-box anchor for the audit chain head (see runbook "Anchoring the audit head"):
      #   audit:
      #     hmac_key_file: "/etc/herdr/assistant-audit.key"   # PATH only (>= 16 bytes)
      #     anchor_file: "/var/lib/herdr-anchor/assistant-audit.anchor"  # append-only; ideally a different device
      #   # Hand approved request_mission / propose_branch delegations to the handoff queue:
      #   delegation_consumer:
      #     enabled: false
      #     source_harness: pi
      #   # Real inference. When `endpoint` is set the service uses an HTTP
      #   # chat-completions runner (OpenAI-compatible, incl. tool-calling); when
      #   # empty it falls back to a deterministic local runner (skeleton only).
      #   # `api_key` is the llm-proxy PROJECT key and is never logged. `model` must
      #   # be one the proxy actually serves (check GET /v1/models) or every call
      #   # returns capacity_unavailable.
      #   inference:
      #     endpoint: "http://llm-proxy:8088/v1/chat/completions"
      #     model: "REDACTED_MODEL_ID"   # e.g. a qwen* id present in the proxy's /v1/models
      #     timeout: 60
      #     api_key: "REDACTED"          # llm-proxy project key (never logged)
      #   # Optional durable store. When set, the assistant snapshots its store to
      #   # pa_store_snapshot (JSONB) in this database on every mutation and reloads
      #   # it on startup, so threads/memory/grants/approvals survive a restart.
      #   persistence:
      #     dsn: "postgresql://REDACTED:REDACTED@postgres:5432/herdr_pa"
      #   # Inject a redacted, INFORMATIONAL-ONLY snapshot of live fleet state (hosts,
      #   # missions, sessions, services, activity) as a system message so the
      #   # assistant can answer questions about the fleet. Payloads are treated as
      #   # data, never instructions (prompt-injection guard), and are secret-redacted.
      #   fleet_context:
      #     enabled: false
      #     max_chars: 6000              # hard cap on the injected snapshot
      #     per_section: 10              # items shown per section
      #   # Agentic tool-calling loop. When enabled, the model may request tools, but
      #   # ONLY tools the user has an active grant for are ever offered (deny-by-
      #   # default), each call is gated, and sensitive tools surface an approval
      #   # instead of auto-running. The loop is capped at max_iterations; each tool
      #   # result is truncated to max_result_chars and secret-redacted before return.
      #   tools:
      #     enabled: false
      #     max_iterations: 5            # max model<->tool round-trips per reply
      #     max_result_chars: 2000       # per-tool-result truncation cap
      #   # Sandbox policy for the computer tools (run_shell / browse /
      #   # connector_request). deny-by-default: they do nothing unless the operator
      #   # opts in AND the target host/command/origin is allowlisted.
      #   computer:
      #     allow_shell: false
      #     allow_browser: false
      #     allowed_hosts: []            # e.g. ["bender"] - never the operator laptop
      #     allowed_commands: []         # exact-command allowlist for run_shell
      #     allowed_connector_origins: []  # https origins reachable by connector/browse (SSRF guard)
      #     max_timeout_seconds: 30
      #   approval_ttl_seconds: 3600     # how long a pending approval stays actionable
      #   grant_max_ttl_seconds: 2592000 # ceiling on a tool grant's lifetime (30d)
      #   max_requests_per_minute: 120   # fixed-window per-key rate limit
      # Variables docker compose itself substitutes; deploy.sh renders exactly this
      # mapping into a transient 0600 env file. The first eight keys are required.
      compose:
        HERDR_CP_PG_USER: "REDACTED"          # same user as in pg_dsn
        HERDR_CP_PG_PASSWORD: "REDACTED"      # same password as in pg_dsn
        HERDR_CP_MINIO_USER: "REDACTED"       # same as minio_user
        HERDR_CP_MINIO_PASSWORD: "REDACTED"   # same as minio_password
        HERDR_CP_WEB_BIND: "127.0.0.1"        # tailnet IP to expose on dev.lan
        HERDR_CP_WEB_PUBLIC_PORT: "80"
        HERDR_CP_PG_PORT: "5432"              # loopback host port of postgres
        GATEWAY_TAILNET_IP: "127.0.0.1"       # `tailscale ip -4`; 127.0.0.1 = loopback only
        # Optional, collab only (needed when the collab marker exists):
        # HERDR_COLLAB_CERT_DIR: "/path/to/collab-edge-certs"  # collab-sync.sh copies ONLY the edge's
        #                                    # fullchain.pem + privkey.pem here (required for collab)
        # HERDR_COLLAB_CERT_UID: "1000"              # owner of the certs, data dir and collab slice
        # HERDR_COLLAB_EDGE_BIND: "127.0.0.1:18444"  # published address of the TLS edge
        # HERDR_COLLAB_OPERATOR_PORT: "9482"         # operator listener on HERDR_CP_WEB_BIND (tailnet)

  llm:
    roles: [builder]
    values:
      upstream_url: "https://llm.example.test"
      upstream_key: "REDACTED"

  ci:
    roles: [builder, ci]
    values:
      url: "https://ci.example.test"
      token: "REDACTED"

  github:
    roles: [ci]
    values:
      token: "REDACTED"

  # Posted by every host's feeds as the control-plane API key (role ingest).
  # Empty = send no X-API-Key (open control plane, the default).
  ingest:
    roles: [all]
    values:
      api_key: ""

  # Used by host-side tools (session run, review bridge): role agent.
  # Trade-off: readable by every host (roles [all]). The agent role can only ingest
  # events, mint/revoke LLM project keys and post reviews - nothing else. Recommended
  # later: scope this section to a role (e.g. [builder]). Empty while keys are off.
  agent:
    roles: [all]
    values:
      api_key: ""

  fabric:
    roles: [all]
    values:
      url: "https://fabric.example.test"
      token: "REDACTED"

  inspector:
    roles: [all]
    values:
      enabled: false
      reasoning: "off"

hosts:
  # token_sha256 is the sha256 hex of the host's random token (the token itself
  # lives only in that host's host.json). Each hash must be unique.
  bender:
    roles: [builder]
    token_sha256: "REDACTED_64_HEX_CHARS"
    overrides:                      # optional, deep-merged over a section
      inspector: {reasoning: "on"}
  mac:
    roles: []                       # empty roles: only "all" sections
    token_sha256: "REDACTED_64_HEX_CHARS"
