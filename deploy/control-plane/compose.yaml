# HerdR Dev Fabric Control Plane — Phase 1 Foundation (spec 0190).
#
# Runs the control plane's persistence + background worker as one compose
# project on the master/gateway host:
#
#   postgres              PostgreSQL 16 — structured state (missions, sessions,
#                         services, events, token_usage, state_snapshots, ...).
#                         NOT SQLite; no large binaries stored here (those live
#                         in rustfs).
#
#   rustfs                object store for artifact payloads. Phase 1 uses
#                         MinIO as an S3 drop-in because RustFS does not ship a
#                         maintained container image yet (known open item). The
#                         client (herdr_engineering.control_plane.rustfs) is
#                         boto3/S3-agnostic, so swapping in a real RustFS image
#                         later is a config-only change.
#
#   control-plane-worker  the bounded background worker: runs migrations on
#                         startup, then loops over stale-lease detection, host
#                         health reconciliation, snapshots, artifact GC.
#                         Deliberately NOT part of the web frontend.
#
#   control-plane-web     the control-plane UI + structured /api/v1 + SSE server
#                         (the web UI is a client of this API). Private-by-default;
#                         expose 8080 only if you intend the control plane to be
#                         reachable from the fabric (e.g. on the dev.lan gateway).
#                         API keys (key: role) live in control_plane.api_keys of
#                         the central fleet file (roles: viewer/operator/ingest/agent).
#
# ONE project for everything on the master host: the control plane services
# above use ordinary bridge networking (they resolve each other by service
# name), while coredns, fabric-gateway and herdr-web (formerly the separate
# `herdr-fabric` project in deploy/fabric-stack) keep `network_mode: host`,
# which the gateway and CoreDNS require. See deploy/fabric-stack/README.md for
# what those three do.
#
# CONFIGURATION: the central fleet file (~/.config/herdr-engineering/fleet-config.yaml,
# created by `herdr-eng fleet config init`) is the only source. The web, worker and
# llm-proxy containers get it as a read-only mount at /etc/herdr/fleet-config.yaml and
# a --fleet-config flag; they read no configuration from the environment. The ${VAR}
# substitutions below are for docker compose itself and third-party images only; they
# come from an env file that deploy.sh renders from the central file, never authors.
#
# Usage (see README.md in this directory): run deploy.sh; do not call
# `docker compose up` by hand (the substitution variables would be missing).
name: herdr-control-plane

services:
  # ---- control plane (bridge network) -------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: herdr-cp-postgres
    restart: unless-stopped
    # SECURITY: credentials are substituted from the env file deploy.sh renders
    # from the central file. Compose refuses to start until they are present.
    environment:
      POSTGRES_USER: "${HERDR_CP_PG_USER:?run deploy.sh}"
      POSTGRES_PASSWORD: "${HERDR_CP_PG_PASSWORD:?run deploy.sh}"
      POSTGRES_DB: herdr
    volumes:
      - herdr-cp-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HERDR_CP_PG_USER} -d herdr"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Host port is loopback-only and configurable (HERDR_CP_PG_PORT) so it can
    # coexist with other Postgres containers on the host. The worker reaches
    # Postgres over the bridge network by service name, so this publish is only
    # for on-host `herdr-eng control-plane migrate` convenience.
    ports:
      - "127.0.0.1:${HERDR_CP_PG_PORT:-5432}:5432"

  rustfs:
    # Pinned: minio/minio:latest is not always pullable; this RELEASE tag is
    # known-good and cached on the deploy host. Swap image here for a real
    # RustFS image later (config-only).
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: herdr-cp-rustfs
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    # SECURITY: credentials are substituted from the rendered env file (see postgres).
    environment:
      MINIO_ROOT_USER: "${HERDR_CP_MINIO_USER:?run deploy.sh}"
      MINIO_ROOT_PASSWORD: "${HERDR_CP_MINIO_PASSWORD:?run deploy.sh}"
    volumes:
      - herdr-cp-rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:9000:9000"   # S3 API (loopback-only)
      - "127.0.0.1:9001:9001"   # MinIO console (loopback-only)

  control-plane-web:
    build:
      context: ../..
      dockerfile: deploy/fabric-stack/Dockerfile
      # Build-time commit stamp surfaced by /api/v1/health; override with
      # `docker compose build --build-arg GIT_COMMIT=$(git rev-parse --short HEAD)`.
      args:
        GIT_COMMIT: ${HERDR_CP_GIT_COMMIT:-dev}
    image: herdr-engineering:${HERDR_CP_IMAGE_TAG:-0.1.0}
    container_name: herdr-cp-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Auth-free within dev.lan: the Tailnet is the trust boundary (all machines
    # belong to each other, WireGuard-encrypted). The host port below is bound
    # to the Tailnet interface (HERDR_CP_WEB_BIND), so only Tailnet clients can
    # reach it — never a plain LAN/`0.0.0.0` exposure. `--allow-open` is the
    # explicit acknowledgment that the Tailnet boundary replaces API keys.
    # No environment: the process reads only the mounted central file
    # (--fleet-config): Postgres DSN, host aliases, RustFS/MinIO, API keys, ...
    volumes:
      - ${HERDR_CP_FLEET_CONFIG_FILE:?run deploy.sh}:/etc/herdr/fleet-config.yaml:ro
    # The HerdR UI is served at dev.lan:<public-port> (default 80 = plain
    # http://dev.lan). Host bind is the Tailnet interface so only Tailnet
    # clients reach it; container keeps its internal 8080 listener.
    ports:
      - "${HERDR_CP_WEB_BIND:-127.0.0.1}:${HERDR_CP_WEB_PUBLIC_PORT:-80}:8080"
    # Exec-form command (no shell): host/port are fixed literals; the Postgres
    # DSN is read from the mounted fleet file, so the password never appears in
    # process args or the environment.
    command:
      - "control-plane"
      - "web"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--web-root"
      - "/app/packages"
      - "--allow-open"
      - "--fleet-config"
      - "/etc/herdr/fleet-config.yaml"

  control-plane-worker:
    build:
      context: ../..
      dockerfile: deploy/fabric-stack/Dockerfile
      args:
        GIT_COMMIT: ${HERDR_CP_GIT_COMMIT:-dev}
    image: herdr-engineering:0.1.0
    container_name: herdr-cp-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    volumes:
      - ${HERDR_CP_FLEET_CONFIG_FILE:?run deploy.sh}:/etc/herdr/fleet-config.yaml:ro
      - ./config.yaml:/app/config.yaml:ro
      # Bundle the SQL migrations into the worker image so it can apply them
      # on startup regardless of the working directory.
      - ../../deploy/control-plane/migrations:/app/migrations:ro
    environment:
      HERDR_ENGINEERING_CONFIG: /app/config.yaml
    command:
      - "control-plane"
      - "worker"
      - "--migrations"
      - "/app/migrations"
      - "--fleet-config"
      - "/etc/herdr/fleet-config.yaml"

  # ---- fabric LLM gateway (project keys + token accounting) --------------------
  # OpenAI-compatible forwarder: agents use a per-project key minted via
  # POST /api/v1/llm/keys; the single lab API key (llm.upstream_key in the central
  # file) never leaves this container. Bound to the tailnet interface only; it is NOT
  # exposed beyond the fabric. Stopgap until the Rust gateway has the `upstream`
  # link role (inferweave-specs spec 63).
  llm-proxy:
    image: herdr-engineering:0.1.0
    container_name: herdr-llm-proxy
    restart: unless-stopped
    depends_on:
      - control-plane-web
    volumes:
      - ${HERDR_CP_FLEET_CONFIG_FILE:?run deploy.sh}:/etc/herdr/fleet-config.yaml:ro
    ports:
      - "${HERDR_CP_WEB_BIND:-127.0.0.1}:${HERDR_LLM_PROXY_PORT:-8088}:8088"
    command:
      - "control-plane"
      - "llm-proxy"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8088"
      - "--control-plane"
      - "http://control-plane-web:8080"
      - "--fleet-config"
      - "/etc/herdr/fleet-config.yaml"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ---- dev.lan front door (host network; was deploy/fabric-stack) -------------
  # The worker mounts ./config.yaml (control plane); the fabric services mount
  # the fabric config from ../fabric-stack. Same project, same rendered substitution file.
  coredns:
    image: coredns/coredns:1.11.4
    container_name: herdr-coredns
    restart: unless-stopped
    network_mode: host
    # Generated on the HOST by scripts/fabric-stack.sh from the .tmpl files
    # (the tailnet IP is host-specific; the distroless image has no shell).
    volumes:
      - ../fabric-stack/coredns/generated/Corefile:/etc/coredns/Corefile:ro
      - ../fabric-stack/coredns/generated/dev.lan.zone:/etc/coredns/dev.lan.zone:ro
    command: ["-conf", "/etc/coredns/Corefile"]

  fabric-gateway:
    build:
      context: ../..
      dockerfile: deploy/fabric-stack/Dockerfile
    image: herdr-engineering:0.1.0
    container_name: herdr-fabric-gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../fabric-stack/config.yaml:/app/config.yaml:ro
      - herdr-state:/state
    environment:
      HERDR_ENGINEERING_STATE: /state
      HERDR_ENGINEERING_CONFIG: /app/config.yaml
      # Secret-free; used by this host's agent so it reaches the gateway via
      # the new dev.lan name. (Other hosts get this from Ansible.)
      HERDR_ENGINEERING_FABRIC_URL: "http://dev.lan:29999"
    command:
      - "devfabric"
      - "gateway"
      - "--control-port"
      - "29999"
      - "--bind"
      - "127.0.0.1,${GATEWAY_TAILNET_IP:?set gateway_tailnet_ip when running fleet config init}"
      - "--url-base"
      - "dev.lan"
      # The container entrypoint is always PID 1, so a stale gateway.lock from
      # a previous (SIGKILLed/crashed) container would be mistaken for a live
      # instance. Compose owns this container's lifecycle, so safe to reset.
      - "--reset-lock"
    healthcheck:
      # The gateway's control API binds the tailnet IP (not loopback), so
      # probe that address (substituted from the rendered env file).
      test: ["CMD", "curl", "-fsS", "http://${GATEWAY_TAILNET_IP}:29999/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  herdr-web:
    image: herdr-engineering:0.1.0
    container_name: herdr-web
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../fabric-stack/config.yaml:/app/config.yaml:ro
    environment:
      HERDR_ENGINEERING_CONFIG: /app/config.yaml
    command: ["web", "--host", "127.0.0.1", "--port", "8787"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  herdr-cp-pg:
  herdr-cp-rustfs:
  # Pre-existing volume of the former `herdr-fabric` project (gateway leases);
  # kept by name so folding the projects together loses no state.
  herdr-state:
    external: true
    name: herdr-fabric_herdr-state
